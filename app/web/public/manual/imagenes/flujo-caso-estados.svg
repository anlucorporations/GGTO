<rect x="940" y="360" width="170" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="940" y="368" width="6" height="64" rx="3" fill="#5b21b6"/><text x="1025" y="396" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">EN_GESTION</text><text x="1025" y="415" fill="#4a5568" font-size="12" text-anchor="middle">En gestión del supervisor</text>
<path d="M1110 400 L1180 400" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="1180" y="360" width="160" height="80" rx="10" fill="#e6f5ec" stroke="#1f7a4d" stroke-width="1.5" filter="url(#sombra)"/><rect x="1180" y="368" width="6" height="64" rx="3" fill="#1f7a4d"/><text x="1260" y="396" fill="#1f7a4d" font-size="14" font-weight="700" text-anchor="middle">CERRADO</text><text x="1260" y="415" fill="#4a5568" font-size="12" text-anchor="middle">Atendido</text>
<path d="M595 360 L595 260 L490 260 L490 220" fill="none" stroke="#8a6100" stroke-width="2" marker-end="url(#flechaAmbar)"/><text x="540" y="252" fill="#8a6100" font-size="11" font-weight="600" text-anchor="middle">diferir</text>
<rect x="380" y="150" width="220" height="70" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="380" y="158" width="6" height="54" rx="3" fill="#8a6100"/><text x="490" y="181" fill="#8a6100" font-size="14" font-weight="700" text-anchor="middle">DIFERIDO</text><text x="490" y="200" fill="#4a5568" font-size="12" text-anchor="middle">Aplazado</text>
<path d="M490 220 L490 330 L860 330 L860 360" fill="none" stroke="#8a6100" stroke-width="2" marker-end="url(#flechaAmbar)"/><text x="700" y="322" fill="#8a6100" font-size="11" font-weight="600" text-anchor="middle">reagendar</text>
<path d="M810 360 L810 220" fill="none" stroke="#8a6100" stroke-width="2" marker-end="url(#flechaAmbar)"/><text x="822" y="300" fill="#8a6100" font-size="11" font-weight="600" text-anchor="start">enrutar</text>
<rect x="700" y="150" width="220" height="70" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="700" y="158" width="6" height="54" rx="3" fill="#8a6100"/><text x="810" y="180.5" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">ENRUTADO</text><text x="810" y="198.5" fill="#4a5568" font-size="12" text-anchor="middle">Derivado a otra instancia</text>
<path d="M145 440 L145 595 L500 595" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#flechaRojo)"/><text x="300" y="585" fill="#b3261e" font-size="11" font-weight="600" text-anchor="middle">cancelar</text>
<rect x="500" y="560" width="200" height="70" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.5" filter="url(#sombra)"/><rect x="500" y="568" width="6" height="54" rx="3" fill="#b3261e"/><text x="600" y="591" fill="#b3261e" font-size="14" font-weight="700" text-anchor="middle">CANCELADO</text><text x="600" y="610" fill="#4a5568" font-size="12" text-anchor="middle">Anulado</text>
<rect x="60" y="660" width="1240" height="100" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><rect x="60" y="668" width="6" height="84" rx="3" fill="#d7dde6"/><text x="82" y="697.5" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">Cómo leer este diagrama</text><text x="82" y="715.5" fill="#4a5568" font-size="11.5" text-anchor="start">estado_actual se valida con un CHECK en RepoTecnico/db/schema.sql y cada cambio queda en el historial caso_estado_hist con el P00 del usuario.</text><text x="82" y="732" fill="#4a5568" font-size="11.5" text-anchor="start">CERRADO y CANCELADO son terminales para el indicador «pendiente»: un caso en esos estados deja de contar como trabajo abierto.</text>

</svg>