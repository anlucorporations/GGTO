<text x="680" y="789" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="60" y="360" width="180" height="80" rx="10" fill="#e8f0fa" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="60" y="368" width="6" height="64" rx="3" fill="#0b4f9c"/><text x="150" y="396" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">NUEVO</text><text x="150" y="415" fill="#4a5568" font-size="12" text-anchor="middle">Recién ingresado</text>
