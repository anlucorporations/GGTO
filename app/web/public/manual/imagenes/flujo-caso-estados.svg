<text x="28" y="57" fill="#cfe0f4" font-size="13">Los nueve estados de estado_actual y sus transiciones típicas</text>
<text x="1332" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1332" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
