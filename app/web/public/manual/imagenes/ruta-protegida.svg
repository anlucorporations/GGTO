<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1140" height="720" fill="#ffffff"/>
<rect x="0" y="0" width="1140" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1140" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Ruta protegida: cómo se valida la sesión</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">El guardián de ruta y la validación contra el motor</text>
<text x="1112" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1112" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="690" width="1140" height="30" fill="#f4f6f9"/>
<text x="570" y="709" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="35" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="35" y="108" width="6" height="36" rx="3" fill="#0b4f9c"/><text x="130" y="130" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">Usuario</text><path d="M130 152 L130 610" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="305" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="305" y="108" width="6" height="36" rx="3" fill="#0b4f9c"/><text x="400" y="130" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">Guardián de ruta</text><path d="M400 152 L400 610" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="605" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="605" y="108" width="6" height="36" rx="3" fill="#0b4f9c"/><text x="700" y="130" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">Motor (valida token)</text><path d="M700 152 L700 610" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="905" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="905" y="108" width="6" height="36" rx="3" fill="#0b4f9c"/><text x="1000" y="130" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">Pantalla solicitada</text><path d="M1000 152 L1000 610" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M132 240 L392 240" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="265" y="232" fill="#08396f" font-size="11.5" font-weight="600" text-anchor="middle">Abre una dirección interna</text><path d="M 400 276 C 462 248 462 304 400 288" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="474" y="286" fill="#0b4f9c" font-size="11.5" font-weight="600" text-anchor="start">¿Sesión guardada?</text><path d="M398 340 L138 340" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaRojo)"/><text x="265" y="332" fill="#b3261e" font-size="11.5" font-weight="600" text-anchor="middle">Redirige a /login</text><path d="M402 400 L692 400" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="550" y="392" fill="#08396f" font-size="11.5" font-weight="600" text-anchor="middle">GET /auth/me</text><path d="M698 440 L408 440" fill="none" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaVerde)"/><text x="550" y="432" fill="#1f7a4d" font-size="11.5" font-weight="600" text-anchor="middle">Usuario válido</text><path d="M 400 474 C 462 446 462 502 400 486" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="474" y="484" fill="#0b4f9c" font-size="11.5" font-weight="600" text-anchor="start">Muestra «Validando sesión…»</text><path d="M402 520 L992 520" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="700" y="512" fill="#08396f" font-size="11.5" font-weight="600" text-anchor="middle">Muestra la pantalla pedida</text>
<rect x="40" y="300" width="1060" height="0" fill="none"/>
<path d="M40 368 L1100 368" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="52" y="362" fill="#b3261e" font-size="11" font-weight="700" text-anchor="start">Sin sesión</text>
<text x="52" y="392" fill="#1f7a4d" font-size="11" font-weight="700" text-anchor="start">Con sesión</text>
<rect x="180" y="590" width="780" height="76" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><rect x="180" y="598" width="6" height="60" rx="3" fill="#b3261e"/><text x="570" y="623.5" fill="#b3261e" font-size="13" font-weight="700" text-anchor="middle">La seguridad real la aplica el motor</text><text x="570" y="641.5" fill="#4a5568" font-size="12" text-anchor="middle">Aunque alguien fuerce una dirección desde el navegador, el motor le negará la operación si su rol no alcanza.</text>

</svg>