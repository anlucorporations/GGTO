<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1000" height="980" fill="#ffffff"/>
<rect x="0" y="0" width="1000" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1000" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Capas del backend GGTO</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Cada cosa en su sitio: del navegador a PostgreSQL</text>
<text x="972" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="972" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="950" width="1000" height="30" fill="#f4f6f9"/>
<text x="500" y="969" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="350" y="100" width="300" height="64" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="350" y="108" width="6" height="48" rx="3" fill="#1f7a4d"/><text x="500" y="136.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Navegador del usuario</text>
<path d="M500 164 L500 190" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="150" y="190" width="700" height="70" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="150" y="198" width="6" height="54" rx="3" fill="#0b4f9c"/><text x="500" y="221" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">main.py · Composición</text><text x="500" y="240" fill="#4a5568" font-size="12" text-anchor="middle">Configura logs, CORS, middleware y rutas; monta la SPA al final</text>
<path d="M500 260 L500 288" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="150" y="288" width="700" height="70" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="150" y="296" width="6" height="54" rx="3" fill="#5b21b6"/><text x="500" y="319" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Middleware · ObservabilidadMiddleware (RNF-19)</text><text x="500" y="338" fill="#4a5568" font-size="12" text-anchor="middle">Etiqueta X-Request-ID, mide milisegundos y registra cada petición</text>
<path d="M500 358 L500 386" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="150" y="386" width="700" height="70" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="150" y="394" width="6" height="54" rx="3" fill="#0b4f9c"/><text x="500" y="408.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Routers (app/api) · puertas de entrada</text><text x="500" y="427.5" fill="#4a5568" font-size="12" text-anchor="middle">Diez módulos por tema: health, auth, config, ingesta, casos,</text><text x="500" y="444.5" fill="#4a5568" font-size="12" text-anchor="middle">despachos, especiales, monitoreo y alertas</text>
<path d="M350 456 L350 486" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M650 456 L650 486" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="100" y="486" width="380" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="100" y="494" width="6" height="74" rx="3" fill="#0e7490"/><text x="290" y="518.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Esquemas (app/schemas)</text><text x="290" y="537.5" fill="#4a5568" font-size="12" text-anchor="middle">Moldes Pydantic de entrada y salida</text><text x="290" y="554.5" fill="#4a5568" font-size="12" text-anchor="middle">base · create · update · out</text>
<rect x="520" y="486" width="380" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="520" y="494" width="6" height="74" rx="3" fill="#1f7a4d"/><text x="710" y="518.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Servicios (app/services)</text><text x="710" y="537.5" fill="#4a5568" font-size="12" text-anchor="middle">Reglas del negocio: ingesta, sectorización,</text><text x="710" y="554.5" fill="#4a5568" font-size="12" text-anchor="middle">despacho, fallas, outbox y monitoreo</text>
<path d="M710 576 L710 616" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M150 421 L80 421 L80 661 L150 661" fill="none" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="7 5"/>
<rect x="150" y="616" width="700" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="150" y="624" width="6" height="74" rx="3" fill="#0b4f9c"/><text x="500" y="648.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Modelos (app/models)</text><text x="500" y="667.5" fill="#4a5568" font-size="12" text-anchor="middle">Las tablas vistas desde el código, agrupadas por tema</text><text x="500" y="684.5" fill="#4a5568" font-size="12" text-anchor="middle">y reexportadas en un solo punto</text>
<path d="M500 706 L500 736" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="150" y="736" width="700" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="150" y="744" width="6" height="64" rx="3" fill="#8a6100"/><text x="500" y="763.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Núcleo (app/core)</text><text x="500" y="782.5" fill="#4a5568" font-size="12" text-anchor="middle">config.py · db.py · security.py · words.py</text><text x="500" y="799.5" fill="#4a5568" font-size="12" text-anchor="middle">No depende de las rutas ni de los servicios</text>
<path d="M500 816 L500 846" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="300" y="846" width="400" height="80" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.5" filter="url(#sombra)"/><rect x="300" y="854" width="6" height="64" rx="3" fill="#1f7a4d"/><text x="500" y="882" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL</text><text x="500" y="901" fill="#4a5568" font-size="12" text-anchor="middle">Una sesión por petición, cerrada siempre</text>

</svg>