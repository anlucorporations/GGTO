<text x="1050" y="520" fill="#4a5568" font-size="12" text-anchor="middle">truekeate-repo</text>
<text x="1050" y="537" fill="#4a5568" font-size="12" text-anchor="middle">ggto-web:v14</text>
<rect x="860" y="610" width="380" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
