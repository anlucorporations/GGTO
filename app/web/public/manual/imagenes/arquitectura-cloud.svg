<text x="770" y="231" fill="#0b4f9c" font-size="11" font-weight="700" text-anchor="middle">socket /cloudsql</text>
<path d="M680 350 L860 350" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="770" y="341" fill="#8a6100" font-size="11" font-weight="700" text-anchor="middle">secretos por nombre</text>
<path d="M680 440 L790 440 L790 490 L860 490" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="770" y="431" fill="#0e7490" font-size="11" font-weight="700" text-anchor="middle">imagen del contenedor</text>
<path d="M680 390 L750 390 L750 665 L860 665" fill="none" stroke="#5b21b6" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaVioleta)"/>
<path d="M860 640 L800 640 L800 205 L860 205" fill="none" stroke="#5b21b6" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaVioleta)"/>
<text x="792" y="470" fill="#5b21b6" font-size="11" font-weight="700" text-anchor="end">roles/cloudsql.client</text>
<path d="M860 630 L830 630 L830 400 L900 400 L900 420" fill="none" stroke="#5b21b6" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaVioleta)"/>
<text x="838" y="555" fill="#5b21b6" font-size="11" font-weight="700" text-anchor="start">secretAccessor</text>
<rect x="60" y="400" width="240" height="108.5" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="68" y="408" width="6" height="92.5" rx="3" fill="#b3261e"/>
<text x="82" y="425.25" fill="#b3261e" font-size="13" font-weight="700" text-anchor="start">Servicio público</text>
<text x="82" y="442.25" fill="#4a5568" font-size="11.5" text-anchor="start">El servicio es público y la base ya</text>
<text x="82" y="459.25" fill="#4a5568" font-size="11.5" text-anchor="start">tiene datos personales reales de</text>
<text x="82" y="476.25" fill="#4a5568" font-size="11.5" text-anchor="start">suscriptores (42 casos con PII).</text>
<text x="82" y="493.25" fill="#4a5568" font-size="11.5" text-anchor="start">Debe restringirse el acceso.</text>
<rect x="60" y="600" width="240" height="108.5" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="68" y="608" width="6" height="92.5" rx="3" fill="#b3261e"/>
<text x="82" y="625.25" fill="#b3261e" font-size="13" font-weight="700" text-anchor="start">Riesgo D-26</text>
<text x="82" y="642.25" fill="#4a5568" font-size="11.5" text-anchor="start">La instancia compartida no tiene</text>
<text x="82" y="659.25" fill="#4a5568" font-size="11.5" text-anchor="start">respaldos, ni PITR, ni protección</text>
<text x="82" y="676.25" fill="#4a5568" font-size="11.5" text-anchor="start">de borrado, ni SSL obligatorio</text>
<text x="82" y="693.25" fill="#4a5568" font-size="11.5" text-anchor="start">hasta migrar a ggtov2-pg.</text>
