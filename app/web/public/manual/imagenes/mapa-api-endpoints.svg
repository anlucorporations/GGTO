<rect width="1440" height="1010" fill="#ffffff"/>
<rect x="0" y="0" width="1440" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1440" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">Mapa de endpoints de la API</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13" text-anchor="start">Nueve grupos de rutas bajo /api/v1 y cuatro niveles de acceso</text>
<text x="1412" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1412" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="980" width="1440" height="30" fill="#f4f6f9"/>
<text x="720" y="999" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>
<rect x="520" y="104" width="400" height="86" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="528" y="112" width="6" height="70" rx="3" fill="#0b4f9c"/>
<text x="720" y="143.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">API de GGTO</text>
<text x="720" y="160.5" fill="#4a5568" font-size="12" text-anchor="middle">prefijo /api/v1 · 73 endpoints en el OpenAPI</text>
<path d="M720 190 L720 224" fill="none" stroke="#0b4f9c" stroke-width="2.5"/>
<path d="M220 224 L1240 224" fill="none" stroke="#0b4f9c" stroke-width="2.5"/>
