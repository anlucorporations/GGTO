<rect x="60" y="250" width="320" height="96" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="68" y="258" width="6" height="80" rx="3" fill="#0b4f9c"/>
<text x="220" y="294.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Públicas por diseño</text>
<text x="220" y="311.5" fill="#4a5568" font-size="11" text-anchor="middle">salud, información y acceso</text>
<path d="M560 224 L560 250" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="400" y="250" width="320" height="96" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="408" y="258" width="6" height="80" rx="3" fill="#0b4f9c"/>
<text x="560" y="294.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Solo con sesión válida</text>
<text x="560" y="311.5" fill="#4a5568" font-size="11" text-anchor="middle">consulta general</text>
<path d="M900 224 L900 250" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="740" y="250" width="320" height="96" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="748" y="258" width="6" height="80" rx="3" fill="#0b4f9c"/>
<text x="900" y="294.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Solo ADMIN o SUPERVISOR</text>
<text x="900" y="311.5" fill="#4a5568" font-size="11" text-anchor="middle">escritura</text>
<path d="M1240 224 L1240 250" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="1080" y="250" width="320" height="96" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="1088" y="258" width="6" height="80" rx="3" fill="#0b4f9c"/>
<text x="1240" y="294.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Con secreto propio</text>
<text x="1240" y="311.5" fill="#4a5568" font-size="11" text-anchor="middle">Telegram y MCP</text>
<rect x="60" y="380" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="68" y="388" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="220" y="418.5" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">GET /health · /ready</text>
<text x="220" y="435.5" fill="#4a5568" font-size="11" text-anchor="middle">y /api/v1/info</text>
<path d="M220 464 L220 476" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="60" y="476" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="68" y="484" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="220" y="506" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">POST /api/v1/auth/...</text>
<text x="220" y="523" fill="#4a5568" font-size="11" text-anchor="middle">login · setup · unlock</text>
<text x="220" y="540" fill="#4a5568" font-size="11" text-anchor="middle">· reset-password</text>
<rect x="400" y="380" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="408" y="388" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="560" y="427" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">PANEL y CASOS</text>
<path d="M560 464 L560 476" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="400" y="476" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="408" y="484" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="560" y="523" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">MONITOREO y reportes</text>
<path d="M560 560 L560 572" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="400" y="572" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="408" y="580" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="560" y="619" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">AGENDA y seguimiento</text>
<path d="M560 656 L560 668" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="400" y="668" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="408" y="676" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="560" y="715" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">Bandeja de notificaciones</text>
<rect x="740" y="380" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="748" y="388" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="900" y="427" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">INGESTA</text>
<path d="M900 464 L900 476" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="740" y="476" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="748" y="484" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="900" y="523" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">DESPACHO</text>
<path d="M900 560 L900 572" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="740" y="572" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="748" y="580" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="900" y="619" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">ESPECIALES</text>
<path d="M900 656 L900 668" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="740" y="668" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="748" y="676" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="900" y="715" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">CONFIGURACIÓN</text>
<path d="M900 752 L900 764" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="740" y="764" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="748" y="772" width="6" height="68" rx="3" fill="#1f7a4d"/>
<text x="900" y="811" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">ALERTAS y fallas masivas</text>
<rect x="1080" y="380" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="1088" y="388" width="6" height="68" rx="3" fill="#0e7490"/>
<text x="1240" y="427" fill="#0e7490" font-size="13.5" font-weight="700" text-anchor="middle">POST /api/v1/telegram/webhook</text>
<path d="M1240 464 L1240 476" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="1080" y="476" width="320" height="84" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="1088" y="484" width="6" height="68" rx="3" fill="#0e7490"/>
<text x="1240" y="523" fill="#0e7490" font-size="13.5" font-weight="700" text-anchor="middle">POST /api/v1/mcp</text>
<rect x="60" y="872" width="1320" height="75.5" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/>
<rect x="68" y="880" width="6" height="59.5" rx="3" fill="#d7dde6"/>
<text x="82" y="897.75" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">Cómo leer este mapa</text>
<text x="82" y="914.75" fill="#4a5568" font-size="11.5" text-anchor="start">Todo vive bajo /api/v1 salvo las dos rutas de salud, que quedan fuera del prefijo. Las rutas con secreto propio no usan el token de sesión: se autentican con el canal de Telegram o con la clave mcp.api_key.</text>
<text x="82" y="931.75" fill="#4a5568" font-size="11.5" text-anchor="start">Las públicas por diseño no exigen token; las de escritura exigen rol ADMIN o SUPERVISOR, y SUPER siempre pasa la autorización.</text>
</svg>
