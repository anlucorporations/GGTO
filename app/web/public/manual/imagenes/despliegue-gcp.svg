<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1240" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1240" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1240" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Despliegue en Google Cloud (GCP)</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Lo que está desplegado hoy y lo que está previsto</text>
<text x="1212" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1212" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="770" width="1240" height="30" fill="#f4f6f9"/>
<text x="620" y="789" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="50" y="96" width="550" height="470" rx="12" fill="#f4f6f9" stroke="#d7dde6" stroke-width="1.5"/><text x="68" y="122" fill="#8a6100" font-size="14" font-weight="700">LO QUE ESTÁ DESPLEGADO HOY (temporal)</text>
<rect x="80" y="145" width="490" height="70" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="80" y="153" width="6" height="54" rx="3" fill="#1f7a4d"/><text x="102" y="176" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">Proyecto truekeate-main</text><text x="102" y="195" fill="#4a5568" font-size="12" text-anchor="start">Con facturación habilitada</text>
<path d="M325 215 L325 250" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="80" y="250" width="490" height="110" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.5" filter="url(#sombra)"/><rect x="80" y="258" width="6" height="94" rx="3" fill="#b3261e"/><text x="102" y="293" fill="#b3261e" font-size="14" font-weight="700" text-anchor="start">Cloud Run · servicio ggto-web</text><text x="102" y="312" fill="#4a5568" font-size="11.5" text-anchor="start">Región europe-west1 · imagen v14</text><text x="102" y="328.5" fill="#4a5568" font-size="11.5" text-anchor="start">ACCESO PÚBLICO con datos personales reales (42 casos)</text>
<path d="M325 360 L325 400" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="80" y="400" width="490" height="130" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="80" y="408" width="6" height="114" rx="3" fill="#8a6100"/><text x="102" y="444" fill="#8a6100" font-size="14" font-weight="700" text-anchor="start">Cloud SQL · truekeate-db-dev</text><text x="102" y="463" fill="#4a5568" font-size="12" text-anchor="start">PostgreSQL 15.18 · base ggtov2</text><text x="102" y="480" fill="#4a5568" font-size="12" text-anchor="start">Instancia compartida con TrueKeate</text><text x="102" y="497" fill="#4a5568" font-size="12" text-anchor="start">SIN backups ni PITR (riesgo D-26)</text>
<rect x="680" y="96" width="510" height="470" rx="12" fill="#e8f0fa" stroke="#d7dde6" stroke-width="1.5"/><text x="698" y="122" fill="#0b4f9c" font-size="14" font-weight="700">LO QUE ESTÁ PREVISTO</text>
<rect x="710" y="145" width="450" height="70" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="710" y="153" width="6" height="54" rx="3" fill="#8a6100"/><text x="732" y="176" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">Proyecto ggtov2</text><text x="732" y="195" fill="#4a5568" font-size="12" text-anchor="start">Facturación deshabilitada: bloqueado</text>
<path d="M920 215 L920 250" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="710" y="250" width="450" height="100" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="710" y="258" width="6" height="84" rx="3" fill="#0b4f9c"/><text x="732" y="296" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">Cloud Run propio</text><text x="732" y="315" fill="#4a5568" font-size="12" text-anchor="start">Servicio migrado al proyecto de GGTO</text>
<path d="M920 350 L920 385" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="710" y="385" width="450" height="145" rx="10" fill="#e6f5ec" stroke="#1f7a4d" stroke-width="1.5" filter="url(#sombra)"/><rect x="710" y="393" width="6" height="129" rx="3" fill="#1f7a4d"/><text x="732" y="437.25" fill="#1f7a4d" font-size="14" font-weight="700" text-anchor="start">Cloud SQL · ggtov2-pg</text><text x="732" y="456.25" fill="#4a5568" font-size="11.5" text-anchor="start">Con copias de seguridad y recuperación</text><text x="732" y="472.75" fill="#4a5568" font-size="11.5" text-anchor="start">a un punto en el tiempo (PITR)</text><text x="732" y="489.25" fill="#4a5568" font-size="11.5" text-anchor="start">y conexión cifrada obligatoria (ENCRYPTED_ONLY)</text>
<path d="M600 340 L680 340" fill="none" stroke="#0b4f9c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaAzul)"/>
<text x="640" y="306" fill="#0b4f9c" font-size="10" font-weight="600" text-anchor="middle">migrar al</text>
<text x="640" y="318" fill="#0b4f9c" font-size="10" font-weight="600" text-anchor="middle">habilitar la</text>
<text x="640" y="330" fill="#0b4f9c" font-size="10" font-weight="600" text-anchor="middle">facturación</text>
<path d="M80 305 L40 305 L40 720 L280 720" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaRojo)"/>
<rect x="280" y="650" width="680" height="100" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.5" filter="url(#sombra)"/><rect x="280" y="658" width="6" height="84" rx="3" fill="#b3261e"/><text x="302" y="687.5" fill="#b3261e" font-size="14" font-weight="700" text-anchor="start">Acción urgente antes de producción</text><text x="302" y="706.5" fill="#4a5568" font-size="12" text-anchor="start">Restringir el acceso al servicio con IAP o invocación autenticada:</text><text x="302" y="723.5" fill="#4a5568" font-size="12" text-anchor="start">hoy cualquiera puede entrar y hay datos personales reales.</text>

</svg>