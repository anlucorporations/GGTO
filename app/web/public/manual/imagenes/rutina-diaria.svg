<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1400" height="1190" fill="#ffffff"/>
<rect x="0" y="0" width="1400" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1400" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">Rutina diaria de operación</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13" text-anchor="start">Del CSV de las 08:00 al cierre del día: ingesta, despacho, monitoreo y alertas</text>
<text x="1372" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1372" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="1160" width="1400" height="30" fill="#f4f6f9"/>
<text x="700" y="1179" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>
<rect x="160" y="110" width="340" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="168" y="118" width="6" height="64" rx="3" fill="#0b4f9c"/>
<text x="330" y="146.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Llega el CSV del día</text>
<text x="330" y="163.5" fill="#4a5568" font-size="12" text-anchor="middle">Antes de las 08:00, hora de Venezuela</text>
<rect x="160" y="220" width="340" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="168" y="228" width="6" height="64" rx="3" fill="#0b4f9c"/>
<text x="330" y="256.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">INGESTA: previsualizar</text>
<text x="330" y="273.5" fill="#4a5568" font-size="12" text-anchor="middle">Simulación sin guardar</text>
<rect x="160" y="330" width="340" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="168" y="338" width="6" height="64" rx="3" fill="#5b21b6"/>
<text x="330" y="375" fill="#5b21b6" font-size="13.5" font-weight="700" text-anchor="middle">¿Hay avisos?</text>
<rect x="540" y="314" width="340" height="80" rx="10" fill="#fff4d6" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="548" y="322" width="6" height="64" rx="3" fill="#8a6100"/>
<text x="710" y="350.5" fill="#8a6100" font-size="13.5" font-weight="700" text-anchor="middle">Revisar encabezado y filas</text>
<text x="710" y="367.5" fill="#4a5568" font-size="12" text-anchor="middle">Consultar a CANTV si cambió el formato</text>
<rect x="160" y="470" width="340" height="80" rx="10" fill="#e6f5ec" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="168" y="478" width="6" height="64" rx="3" fill="#1f7a4d"/>
<text x="330" y="506.5" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">INGESTA: confirmar carga</text>
<text x="330" y="523.5" fill="#4a5568" font-size="12" text-anchor="middle">Crea los casos en NUEVO</text>
<rect x="160" y="590" width="340" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="168" y="598" width="6" height="64" rx="3" fill="#0b4f9c"/>
<text x="330" y="626.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">PANEL y CASOS</text>
<text x="330" y="643.5" fill="#4a5568" font-size="12" text-anchor="middle">Revisar los casos nuevos</text>
<rect x="790" y="590" width="340" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="798" y="598" width="6" height="64" rx="3" fill="#0b4f9c"/>
<text x="960" y="626.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">DESPACHO: calcular propuesta</text>
<text x="960" y="643.5" fill="#4a5568" font-size="12" text-anchor="middle">Simulación del reparto</text>
<rect x="540" y="700" width="340" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="548" y="708" width="6" height="64" rx="3" fill="#5b21b6"/>
<text x="710" y="736.5" fill="#5b21b6" font-size="13.5" font-weight="700" text-anchor="middle">ESPECIALES y AGENDA</text>
<text x="710" y="753.5" fill="#4a5568" font-size="12" text-anchor="middle">Citas y casos especiales</text>
<rect x="790" y="710" width="340" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="798" y="718" width="6" height="64" rx="3" fill="#0b4f9c"/>
<text x="960" y="746.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">DESPACHO: generar, imprimir</text>
<text x="960" y="763.5" fill="#4a5568" font-size="12" text-anchor="middle">y enviar la ficha</text>
<rect x="790" y="830" width="340" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="798" y="838" width="6" height="64" rx="3" fill="#0e7490"/>
<text x="960" y="866.5" fill="#0e7490" font-size="13.5" font-weight="700" text-anchor="middle">Corte de las 16:00</text>
<text x="960" y="883.5" fill="#4a5568" font-size="12" text-anchor="middle">Reporte de producción manual</text>
<rect x="790" y="950" width="340" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="798" y="958" width="6" height="64" rx="3" fill="#0b4f9c"/>
<text x="960" y="986.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">MONITOREO</text>
<text x="960" y="1003.5" fill="#4a5568" font-size="12" text-anchor="middle">Tableros del día</text>
<rect x="790" y="1070" width="340" height="80" rx="10" fill="#fff4d6" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="798" y="1078" width="6" height="64" rx="3" fill="#8a6100"/>
<text x="960" y="1106.5" fill="#8a6100" font-size="13.5" font-weight="700" text-anchor="middle">ALERTAS</text>
<text x="960" y="1123.5" fill="#4a5568" font-size="12" text-anchor="middle">Bandeja de salida y fallas masivas</text>
<path d="M330 190 L330 220" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M330 300 L330 330" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M500 370 L540 370" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="520" y="361" fill="#8a6100" font-size="11" font-weight="700" text-anchor="middle">Sí</text>
<path d="M330 410 L330 470" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="344" y="445" fill="#1f7a4d" font-size="11" font-weight="700" text-anchor="start">No</text>
<path d="M710 394 L710 440 L450 440 L450 470" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M330 550 L330 590" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M500 630 L790 630" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M500 650 L710 650 L710 700" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="600" y="641" fill="#5b21b6" font-size="11" font-weight="700" text-anchor="middle">citas</text>
<path d="M960 670 L960 710" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M960 790 L960 830" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M960 910 L960 950" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M960 1030 L960 1070" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="160" y="700" width="340" height="141.5" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/>
<rect x="168" y="708" width="6" height="125.5" rx="3" fill="#d7dde6"/>
<text x="182" y="724.75" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">Ventana y formato del archivo</text>
<text x="182" y="741.75" fill="#4a5568" font-size="11.5" text-anchor="start">La entrega es diaria, en días hábiles y antes de las</text>
<text x="182" y="758.75" fill="#4a5568" font-size="11.5" text-anchor="start">08:00 (hora de Venezuela).</text>
<text x="182" y="775.75" fill="#4a5568" font-size="11.5" text-anchor="start">El archivo se llama</text>
<text x="182" y="792.75" fill="#4a5568" font-size="11.5" text-anchor="start">detalle_averias_gpon_&lt;fecha&gt;.csv, usa «;» como</text>
<text x="182" y="809.75" fill="#4a5568" font-size="11.5" text-anchor="start">separador, codificación ISO-8859-1 y 80 columnas</text>
<text x="182" y="826.75" fill="#4a5568" font-size="11.5" text-anchor="start">que se leen por posición.</text>
<rect x="160" y="850" width="340" height="108.5" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/>
<rect x="168" y="858" width="6" height="92.5" rx="3" fill="#d7dde6"/>
<text x="182" y="875.25" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">Quién puede hacerlo</text>
<text x="182" y="892.25" fill="#4a5568" font-size="11.5" text-anchor="start">La ingesta y el despacho exigen rol ADMIN o</text>
<text x="182" y="909.25" fill="#4a5568" font-size="11.5" text-anchor="start">SUPERVISOR; SUPER siempre pasa la autorización.</text>
<text x="182" y="926.25" fill="#4a5568" font-size="11.5" text-anchor="start">El corte de las 16:00 es un reporte manual de</text>
<text x="182" y="943.25" fill="#4a5568" font-size="11.5" text-anchor="start">producción.</text>
</svg>
