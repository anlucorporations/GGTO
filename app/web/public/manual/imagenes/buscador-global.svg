<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1400" height="1030" fill="#ffffff"/>
<rect x="0" y="0" width="1400" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1400" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">Buscador global de casos</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13" text-anchor="start">Búsqueda por incidente, teléfono, cliente o dirección y salto a la ficha</text>
<text x="1372" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1372" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="1000" width="1400" height="30" fill="#f4f6f9"/>
<text x="700" y="1019" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>
<rect x="310" y="104" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="318" y="112" width="6" height="56" rx="3" fill="#0b4f9c"/>
<text x="480" y="136.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Escribir incidente, teléfono,</text>
<text x="480" y="153.5" fill="#4a5568" font-size="12" text-anchor="middle">cliente o dirección</text>
<rect x="310" y="206" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="318" y="214" width="6" height="56" rx="3" fill="#5b21b6"/>
<text x="480" y="247" fill="#5b21b6" font-size="13.5" font-weight="700" text-anchor="middle">¿Hay texto?</text>
<rect x="310" y="314" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="318" y="322" width="6" height="56" rx="3" fill="#0b4f9c"/>
<text x="480" y="346.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Consultar /casos/buscar?q=</text>
<text x="480" y="363.5" fill="#4a5568" font-size="12" text-anchor="middle">Hasta 8 coincidencias</text>
<rect x="310" y="422" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="318" y="430" width="6" height="56" rx="3" fill="#5b21b6"/>
<text x="480" y="463" fill="#5b21b6" font-size="13.5" font-weight="700" text-anchor="middle">¿Hay coincidencias?</text>
<rect x="310" y="534" width="340" height="86" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="318" y="542" width="6" height="70" rx="3" fill="#0b4f9c"/>
<text x="480" y="565" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Desplegable con ID de avería,</text>
<text x="480" y="582" fill="#4a5568" font-size="12" text-anchor="middle">cliente, teléfono y estado</text>
<text x="480" y="599" fill="#4a5568" font-size="12" text-anchor="middle">máximo 8 opciones</text>
<rect x="310" y="656" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="318" y="664" width="6" height="56" rx="3" fill="#0b4f9c"/>
<text x="480" y="688.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Elegir un resultado</text>
<text x="480" y="705.5" fill="#4a5568" font-size="12" text-anchor="middle">De la lista desplegable</text>
<rect x="310" y="768" width="340" height="72" rx="10" fill="#e6f5ec" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="318" y="776" width="6" height="56" rx="3" fill="#1f7a4d"/>
<text x="480" y="800.5" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">Abrir la ficha del caso</text>
<text x="480" y="817.5" fill="#4a5568" font-size="12" text-anchor="middle">En la sección CASOS</text>
<rect x="900" y="210" width="440" height="72" rx="10" fill="#fff4d6" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="908" y="218" width="6" height="56" rx="3" fill="#8a6100"/>
<text x="1120" y="242.5" fill="#8a6100" font-size="13.5" font-weight="700" text-anchor="middle">Aviso al usuario</text>
<text x="1120" y="259.5" fill="#4a5568" font-size="12" text-anchor="middle">Escriba un incidente, teléfono, cliente o dirección</text>
<rect x="900" y="442" width="440" height="72" rx="10" fill="#fff4d6" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="908" y="450" width="6" height="56" rx="3" fill="#8a6100"/>
<text x="1120" y="474.5" fill="#8a6100" font-size="13.5" font-weight="700" text-anchor="middle">Sin coincidencias</text>
<text x="1120" y="491.5" fill="#4a5568" font-size="12" text-anchor="middle">El desplegable queda vacío</text>
<rect x="900" y="590" width="440" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="908" y="598" width="6" height="56" rx="3" fill="#0e7490"/>
<text x="1120" y="622.5" fill="#0e7490" font-size="13.5" font-weight="700" text-anchor="middle">Botón de limpiar</text>
<text x="1120" y="639.5" fill="#4a5568" font-size="12" text-anchor="middle">Vacía el texto y los resultados</text>
<path d="M480 176 L480 206" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M650 242 L900 242" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="775" y="234" fill="#8a6100" font-size="11" font-weight="700" text-anchor="middle">No</text>
<path d="M480 278 L480 314" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="494" y="302" fill="#0b4f9c" font-size="11" font-weight="700" text-anchor="start">Sí</text>
<path d="M480 386 L480 422" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M650 458 L900 458" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="775" y="450" fill="#8a6100" font-size="11" font-weight="700" text-anchor="middle">No</text>
<path d="M480 494 L480 534" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="494" y="518" fill="#0b4f9c" font-size="11" font-weight="700" text-anchor="start">Sí</text>
<path d="M480 620 L480 656" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M480 728 L480 768" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M650 577 L775 577 L775 626 L900 626" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="712" y="569" fill="#0e7490" font-size="11" font-weight="700" text-anchor="middle">limpiar</text>
<rect x="60" y="866" width="1280" height="108.5" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/>
<rect x="68" y="874" width="6" height="92.5" rx="3" fill="#d7dde6"/>
<text x="82" y="891.25" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">Cómo se comporta y cómo se usa con lector de pantalla</text>
<text x="82" y="908.25" fill="#4a5568" font-size="11.5" text-anchor="start">Al elegir un resultado la pantalla navega a CASOS pasando el id_caso y la ficha se abre sola, sin volver a buscar.</text>
<text x="82" y="925.25" fill="#4a5568" font-size="11.5" text-anchor="start">El formulario se anuncia como región de búsqueda, el desplegable como lista de opciones y cada resultado como una opción; los botones llevan etiqueta de accesibilidad y el desplegable se cierra al hacer clic</text>
<text x="82" y="942.25" fill="#4a5568" font-size="11.5" text-anchor="start">fuera.</text>
<text x="82" y="959.25" fill="#4a5568" font-size="11.5" text-anchor="start">La prueba de extremo a extremo cubre las secciones, el menú CONFIGURACIÓN, el control de acceso por rol, la barra móvil y el buscador.</text>
</svg>
