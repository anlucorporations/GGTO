<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1400" height="1010" fill="#ffffff"/>
<rect x="0" y="0" width="1400" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1400" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">Flujo de ingreso con P00 y clave</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13" text-anchor="start">Diagrama de decisión de POST /api/v1/auth/login: intentos, bloqueo y token</text>
<text x="1372" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1372" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="980" width="1400" height="30" fill="#f4f6f9"/>
<text x="700" y="999" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>
<rect x="350" y="100" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="358" y="108" width="6" height="56" rx="3" fill="#0b4f9c"/>
<text x="520" y="132.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">El usuario escribe P00 y clave</text>
<text x="520" y="149.5" fill="#4a5568" font-size="12" text-anchor="middle">Formulario del ingreso</text>
<rect x="350" y="212" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="358" y="220" width="6" height="56" rx="3" fill="#5b21b6"/>
<text x="520" y="253" fill="#5b21b6" font-size="13.5" font-weight="700" text-anchor="middle">¿El P00 existe?</text>
<rect x="350" y="324" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="358" y="332" width="6" height="56" rx="3" fill="#5b21b6"/>
<text x="520" y="365" fill="#5b21b6" font-size="13.5" font-weight="700" text-anchor="middle">¿La cuenta está activa?</text>
<rect x="350" y="436" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="358" y="444" width="6" height="56" rx="3" fill="#5b21b6"/>
<text x="520" y="477" fill="#5b21b6" font-size="13.5" font-weight="700" text-anchor="middle">¿La cuenta está bloqueada?</text>
<rect x="350" y="548" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="358" y="556" width="6" height="56" rx="3" fill="#5b21b6"/>
<text x="520" y="589" fill="#5b21b6" font-size="13.5" font-weight="700" text-anchor="middle">¿La clave coincide?</text>
<rect x="350" y="660" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="358" y="668" width="6" height="56" rx="3" fill="#8a6100"/>
<text x="520" y="692.5" fill="#8a6100" font-size="13.5" font-weight="700" text-anchor="middle">Suma un intento fallido</text>
<text x="520" y="709.5" fill="#4a5568" font-size="12" text-anchor="middle">Contador por cuenta</text>
<rect x="350" y="772" width="340" height="72" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="358" y="780" width="6" height="56" rx="3" fill="#5b21b6"/>
<text x="520" y="813" fill="#5b21b6" font-size="13.5" font-weight="700" text-anchor="middle">¿Llegó al máximo de 3?</text>
<rect x="350" y="884" width="340" height="72" rx="10" fill="#fdecea" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="358" y="892" width="6" height="56" rx="3" fill="#b3261e"/>
<text x="520" y="916.5" fill="#b3261e" font-size="13.5" font-weight="700" text-anchor="middle">Bloquea la cuenta (423)</text>
<text x="520" y="933.5" fill="#4a5568" font-size="12" text-anchor="middle">Tercer fallo consecutivo</text>
<rect x="900" y="216" width="440" height="64" rx="10" fill="#fdecea" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="908" y="224" width="6" height="48" rx="3" fill="#b3261e"/>
<text x="1120" y="244.5" fill="#b3261e" font-size="13.5" font-weight="700" text-anchor="middle">401: mensaje genérico</text>
<text x="1120" y="261.5" fill="#4a5568" font-size="12" text-anchor="middle">No revela si el P00 existe</text>
<rect x="900" y="328" width="440" height="64" rx="10" fill="#fdecea" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="908" y="336" width="6" height="48" rx="3" fill="#b3261e"/>
<text x="1120" y="356.5" fill="#b3261e" font-size="13.5" font-weight="700" text-anchor="middle">403: cuenta inactiva</text>
<text x="1120" y="373.5" fill="#4a5568" font-size="12" text-anchor="middle">El usuario existe pero está inactivo</text>
<rect x="900" y="440" width="440" height="64" rx="10" fill="#fdecea" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="908" y="448" width="6" height="48" rx="3" fill="#b3261e"/>
<text x="1120" y="468.5" fill="#b3261e" font-size="13.5" font-weight="700" text-anchor="middle">423: use la recuperación con palabras</text>
<text x="1120" y="485.5" fill="#4a5568" font-size="12" text-anchor="middle">Pide 3 de las 12 palabras de seguridad</text>
<rect x="900" y="600" width="440" height="72" rx="10" fill="#e6f5ec" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="908" y="608" width="6" height="56" rx="3" fill="#1f7a4d"/>
<text x="1120" y="632.5" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">200: token emitido</text>
<text x="1120" y="649.5" fill="#4a5568" font-size="12" text-anchor="middle">Reinicia los intentos · vigencia de 480 min</text>
<rect x="900" y="884" width="440" height="72" rx="10" fill="#fff4d6" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="908" y="892" width="6" height="56" rx="3" fill="#8a6100"/>
<text x="1120" y="916.5" fill="#8a6100" font-size="13.5" font-weight="700" text-anchor="middle">401 con X-Intentos-Restantes</text>
<text x="1120" y="933.5" fill="#4a5568" font-size="12" text-anchor="middle">Quedan 2 o 1 intentos antes del bloqueo</text>
<path d="M520 172 L520 212" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M520 284 L520 324" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="534" y="308" fill="#0b4f9c" font-size="11" font-weight="700" text-anchor="start">Sí</text>
<path d="M690 248 L900 248" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="800" y="240" fill="#b3261e" font-size="11" font-weight="700" text-anchor="middle">No</text>
<path d="M520 396 L520 436" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="534" y="420" fill="#0b4f9c" font-size="11" font-weight="700" text-anchor="start">Sí</text>
<path d="M690 360 L900 360" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="800" y="352" fill="#b3261e" font-size="11" font-weight="700" text-anchor="middle">No</text>
<path d="M520 508 L520 548" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="534" y="532" fill="#0b4f9c" font-size="11" font-weight="700" text-anchor="start">Sí</text>
<path d="M690 472 L900 472" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="800" y="464" fill="#b3261e" font-size="11" font-weight="700" text-anchor="middle">Sí</text>
<path d="M520 620 L520 660" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="534" y="644" fill="#0b4f9c" font-size="11" font-weight="700" text-anchor="start">No</text>
<path d="M690 584 L795 584 L795 636 L900 636" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="748" y="576" fill="#1f7a4d" font-size="11" font-weight="700" text-anchor="middle">Sí</text>
<path d="M520 732 L520 772" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M520 844 L520 884" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="534" y="868" fill="#b3261e" font-size="11" font-weight="700" text-anchor="start">Sí</text>
<path d="M690 808 L795 808 L795 920 L900 920" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="748" y="800" fill="#8a6100" font-size="11" font-weight="700" text-anchor="middle">No</text>
<rect x="60" y="100" width="260" height="200" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="68" y="108" width="6" height="184" rx="3" fill="#0b4f9c"/>
<text x="82" y="162.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="start">Códigos de respuesta</text>
<text x="82" y="179.5" fill="#4a5568" font-size="12" text-anchor="start">200 · Token emitido</text>
<text x="82" y="196.5" fill="#4a5568" font-size="12" text-anchor="start">401 · Credencial inválida</text>
<text x="82" y="213.5" fill="#4a5568" font-size="12" text-anchor="start">403 · Cuenta inactiva</text>
<text x="82" y="230.5" fill="#4a5568" font-size="12" text-anchor="start">423 · Cuenta bloqueada</text>
<text x="82" y="247.5" fill="#4a5568" font-size="12" text-anchor="start">429 · Demasiados intentos</text>
<rect x="60" y="326" width="260" height="240.5" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/>
<rect x="68" y="334" width="6" height="224.5" rx="3" fill="#d7dde6"/>
<text x="82" y="349.25" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">Reglas verificadas</text>
<text x="82" y="366.25" fill="#4a5568" font-size="11.5" text-anchor="start">La clave se guarda con Argon2id y el</text>
<text x="82" y="383.25" fill="#4a5568" font-size="11.5" text-anchor="start">token es JWT HS256 con vigencia de</text>
<text x="82" y="400.25" fill="#4a5568" font-size="11.5" text-anchor="start">480 minutos (8 horas).</text>
<text x="82" y="417.25" fill="#4a5568" font-size="11.5" text-anchor="start">Tres fallos consecutivos bloquean la</text>
<text x="82" y="434.25" fill="#4a5568" font-size="11.5" text-anchor="start">cuenta; se recupera con 3 de las 12</text>
<text x="82" y="451.25" fill="#4a5568" font-size="11.5" text-anchor="start">palabras de seguridad.</text>
<text x="82" y="468.25" fill="#4a5568" font-size="11.5" text-anchor="start">El límite es de 10 intentos cada 60</text>
<text x="82" y="485.25" fill="#4a5568" font-size="11.5" text-anchor="start">segundos por P00 e IP (429 Too</text>
<text x="82" y="502.25" fill="#4a5568" font-size="11.5" text-anchor="start">Many Requests).</text>
<text x="82" y="519.25" fill="#4a5568" font-size="11.5" text-anchor="start">Ante un P00 inexistente el mensaje</text>
<text x="82" y="536.25" fill="#4a5568" font-size="11.5" text-anchor="start">es genérico: no revela si el usuario</text>
<text x="82" y="553.25" fill="#4a5568" font-size="11.5" text-anchor="start">existe.</text>
<rect x="60" y="700" width="260" height="125" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/>
<rect x="68" y="708" width="6" height="109" rx="3" fill="#d7dde6"/>
<text x="82" y="725" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">Qué no existe en la v1</text>
<text x="82" y="742" fill="#4a5568" font-size="11.5" text-anchor="start">No hay aplicación móvil Flutter ni</text>
<text x="82" y="759" fill="#4a5568" font-size="11.5" text-anchor="start">canal de WhatsApp.</text>
<text x="82" y="776" fill="#4a5568" font-size="11.5" text-anchor="start">Telegram y correo están sin</text>
<text x="82" y="793" fill="#4a5568" font-size="11.5" text-anchor="start">credenciales: los envíos quedan</text>
<text x="82" y="810" fill="#4a5568" font-size="11.5" text-anchor="start">PENDIENTE en la bandeja (outbox).</text>
</svg>
