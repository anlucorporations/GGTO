<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1320" height="900" fill="#ffffff"/>
<rect x="0" y="0" width="1320" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1320" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Flujo de despacho del día</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">De los casos pendientes al trabajo de cada cuadrilla</text>
<text x="1292" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1292" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="870" width="1320" height="30" fill="#f4f6f9"/>
<text x="660" y="889" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="460" y="100" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="460" y="108" width="6" height="64" rx="3" fill="#1f7a4d"/><text x="660" y="136" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Casos del día</text><text x="660" y="155" fill="#4a5568" font-size="12" text-anchor="middle">Nuevos, citados y pendientes de gestionar</text>
<path d="M660 180 L660 210" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="380" y="210" width="560" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="380" y="218" width="6" height="74" rx="3" fill="#5b21b6"/><text x="660" y="242.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Filtros de la propuesta</text><text x="660" y="261.5" fill="#4a5568" font-size="12" text-anchor="middle">Excluye los casos de la cuadrilla 0 (gestión del supervisor),</text><text x="660" y="278.5" fill="#4a5568" font-size="12" text-anchor="middle">los ya despachados y los no elegibles</text>
<path d="M660 300 L660 340" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="380" y="340" width="560" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="380" y="348" width="6" height="74" rx="3" fill="#0b4f9c"/><text x="660" y="372.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Propuesta (simular)</text><text x="660" y="391.5" fill="#4a5568" font-size="12" text-anchor="middle">Balanceo greedy entre las cuadrillas</text><text x="660" y="408.5" fill="#4a5568" font-size="12" text-anchor="middle">según carga, sector y disponibilidad</text>
<path d="M660 430 L660 470" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="380" y="470" width="560" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="380" y="478" width="6" height="74" rx="3" fill="#0b4f9c"/><text x="660" y="502.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Generar despacho</text><text x="660" y="521.5" fill="#4a5568" font-size="12" text-anchor="middle">Estado PROPUESTA → CONFIRMADA</text><text x="660" y="538.5" fill="#4a5568" font-size="12" text-anchor="middle">Se crean las filas de despacho_caso</text>
<path d="M660 560 L660 600" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="380" y="600" width="560" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="380" y="608" width="6" height="64" rx="3" fill="#0b4f9c"/><text x="660" y="636" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Imprimir hoja de ruta</text><text x="660" y="655" fill="#4a5568" font-size="12" text-anchor="middle">Reporte de las 16:00 por cuadrilla</text>
<path d="M660 680 L660 720" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="380" y="720" width="560" height="80" rx="10" fill="#ffffff" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="380" y="728" width="6" height="64" rx="3" fill="#8a6100"/><text x="660" y="747.5" fill="#8a6100" font-size="14" font-weight="700" text-anchor="middle">Enviar el aviso por Telegram</text><text x="660" y="766.5" fill="#4a5568" font-size="12" text-anchor="middle">Destino en despacho.destino_telegram;</text><text x="660" y="783.5" fill="#4a5568" font-size="12" text-anchor="middle">si está vacío, la notificación queda PENDIENTE</text>
<path d="M380 515 L340 515" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="60" y="470" width="280" height="180" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.5" filter="url(#sombra)"/><rect x="60" y="478" width="6" height="164" rx="3" fill="#1f7a4d"/><text x="200" y="539" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Cuadrillas</text><text x="200" y="558" fill="#4a5568" font-size="12" text-anchor="middle">Integrantes y vehículos</text><text x="200" y="575" fill="#4a5568" font-size="12" text-anchor="middle">asignados desde</text><text x="200" y="592" fill="#4a5568" font-size="12" text-anchor="middle">CONFIGURACIÓN</text>
<path d="M940 760 L1020 760" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="1020" y="700" width="270" height="140" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="1020" y="708" width="6" height="124" rx="3" fill="#8a6100"/><text x="1155" y="750" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">Bandeja de salida (outbox)</text><text x="1155" y="768" fill="#4a5568" font-size="11" text-anchor="middle">Telegram y correo aún no</text><text x="1155" y="784" fill="#4a5568" font-size="11" text-anchor="middle">tienen credenciales: el envío</text><text x="1155" y="800" fill="#4a5568" font-size="11" text-anchor="middle">queda PENDIENTE y no se pierde.</text>
<path d="M940 640 L1020 640" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="1020" y="470" width="270" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="1020" y="478" width="6" height="164" rx="3" fill="#0b4f9c"/><text x="1155" y="524" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">Ejecución en campo</text><text x="1155" y="542" fill="#4a5568" font-size="11" text-anchor="middle">despacho_caso:</text><text x="1155" y="558" fill="#4a5568" font-size="11" text-anchor="middle">EN_COLA → RESUELTO / DEVUELTO</text><text x="1155" y="574" fill="#4a5568" font-size="11" text-anchor="middle">El despacho pasa a CUMPLIDA</text><text x="1155" y="590" fill="#4a5568" font-size="11" text-anchor="middle">Un caso de cuadrilla 0</text><text x="1155" y="606" fill="#4a5568" font-size="11" text-anchor="middle">devuelve error 409</text>
<rect x="60" y="720" width="280" height="130" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><rect x="60" y="728" width="6" height="114" rx="3" fill="#d7dde6"/><text x="200" y="765" fill="#4a5568" font-size="13" font-weight="700" text-anchor="middle">Estados del despacho</text><text x="200" y="783" fill="#4a5568" font-size="11" text-anchor="middle">PROPUESTA · CONFIRMADA</text><text x="200" y="799" fill="#4a5568" font-size="11" text-anchor="middle">CUMPLIDA · REPROGRAMADA</text><text x="200" y="815" fill="#4a5568" font-size="11" text-anchor="middle">DIFERIDA · CANCELADA</text>

</svg>