name: CI

on:
  push:
    branches: ["GGTOv2-DSH-GCP", main]
  pull_request:
    branches: ["GGTOv2-DSH-GCP", main]

jobs:
  backend:
    name: Backend (lint, tipos, pruebas)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ggto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GGTO_TEST_DB_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ggto_test
      GGTO_TEST_SCHEMA: public
      SECRET_KEY: secreto-solo-para-ci
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r app/requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check app

      - name: Tipos (mypy)
        run: mypy app --ignore-missing-imports

      - name: Pruebas (unitarias + integración)
        run: pytest app/tests -q
