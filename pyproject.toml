[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
# B008: FastAPI usa `Depends(...)` como valor por defecto (patrón oficial).
ignore = ["B008"]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
