apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ggto-migrar-tg-grupo
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: ggto-prod-txblvento2:europe-west1:ggto-db
        run.googleapis.com/vpc-access-connector: ggto-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      taskCount: 1
      template:
        spec:
          timeoutSeconds: '300'
          maxRetries: 0
          containers:
          - image: europe-west1-docker.pkg.dev/ggto-prod-txblvento2/ggto/ggto-web:v105
            command: ["python", "-c"]
            args: ["import base64; exec(base64.b64decode('').decode())"]
            env:
            - name: DB_HOST
              value: 10.140.0.2
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ggtov2
            - name: DB_USER
              value: ggtov2_app
            - name: DB_SSLMODE
              value: disable
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: ggtov2-db-password
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
          serviceAccountName: ggto-web-sa@ggto-prod-txblvento2.iam.gserviceaccount.com
