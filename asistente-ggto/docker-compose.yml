# docker-compose de asistente-ggto (patrón v2.2, LLM principal OpenRouter GCP)
# Sin secretos en este archivo: la credencial entra por docker secret
# y por env_file root-only (RS-2). Cambio respecto a v2-A0:
#   - LLM_PROVIDER=opencode + MODEL_ID=nemotron-3.5-super-vl-free (antes openrouter)
#   - OPENROUTER_API_KEY (docker secret /run/secrets/openrouter_api_key)
#   - GGTO_MCP_KEY (docker secret /run/secrets/ggto_mcp_key, ahora obligatorio para herramientas)
#   - Todo lo demás (Telegram, GGTO_USER/PASS, MONGO, tarifa) se mantiene.

services:
  asistente:
    build: .
    container_name: asistente-ggto
    restart: unless-stopped
    environment:
      - LLM_PROVIDER=opencode            # proveedor activo: opencode (Gateway) u openrouter
      - GATEWAY_URL=http://100.125.94.21:4090      # Gateway OpenCode en vm-dsh-dev (tailnet)
      - GATEWAY_AUTH_KEY=${GATEWAY_AUTH_KEY}       # REF-SEC-26 opcode-gateway-api-key (env_file root-only)
      - MODEL_ID=nvidia/nemotron-3.5-super-vl-120b-a12b  # Nemotron 3.5 Super VL (variante NVIDIA; la :free de opencode agotó cuota)
      - MODEL_PROVIDER=nvidia                      # providerID del modelo en el gateway (API key NVIDIA configurada allí)
      - OPENROUTER_URL=${OPENROUTER_URL}  # legado: se mantiene para volver a openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}  # legado: secret inyectado por wrapper o env_file
      - GGTO_MCP_KEY=${GGTO_MCP_KEY}     # clave X-MCP-Key del servidor MCP GGTO (fail-closed)
      - GGTO_API_URL=https://ggto-web-depapaeivq-ew.a.run.app   # Cloud Run de ggto-prod-txblvento2 (producción vigente)
      - GGTO_SERVICE_USER=${GGTO_SERVICE_USER}       # p00 del usuario de servicio (alta en GGTO, rol SUPERVISOR/ADMIN)
      - GGTO_SERVICE_PASSWORD=${GGTO_SERVICE_PASSWORD}  # vía docker secret ggto_service_pass o env_file root-only
      - RATE_PER_MIN=30
      - DAILY_CHAT_LIMIT=500
      - MONGO_URL=${MONGO_URL}                       # BD proj_ggto (canon v2-A5, usuario dedicado)
      - MONGO_DB=proj_ggto
      - TELEGRAM_API_URL=https://api.telegram.org    # C5: para humo se puede simular por env
      - TELEGRAM_SECRET=${TELEGRAM_SECRET}           # C5: secret_token del webhook (docker secret telegram_secret)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}     # C5: token del bot (docker secret telegram_bot_token)
      - LLM_TOOLS_ENABLED=${LLM_TOOLS_ENABLED:-true}  # true: expone herramientas MCP; false: LLM solo chat
      - PORT=3000
    env_file:
      - /etc/secure/asistente-ggto.env               # root-only, generado por alta (nunca en repo)
    ports:
      - "100.113.94.52:3004:3000"                    # IP Tailscale de vm-preview (3002 hotel, 3003 web2 → 3004 GGTO)
    networks:
      - asistente-net
    deploy:
      resources:
        limits: { cpus: "1", memory: "1073741824" }   # 1 CPU / 1 GB (canon; la API de Coolify no acepta limits)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
networks:
  asistente-net:
    external: true
