<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1400" height="860" fill="#ffffff"/>
<rect x="0" y="0" width="1400" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1400" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">Pirámide de pruebas de la Fase 4</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13" text-anchor="start">Cuatro niveles, 169 pruebas pytest y 46 pruebas E2E de navegador</text>
<text x="1372" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1372" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="830" width="1400" height="30" fill="#f4f6f9"/>
<text x="700" y="849" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>
<polygon points="340,170 560,170 660,285 240,285" fill="#0b4f9c"/>
<text x="450" y="222" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">E2E · 46 pruebas</text>
<text x="450" y="244" fill="#e8f0fa" font-size="11.5" text-anchor="middle">Playwright / Chromium</text>
<polygon points="240,285 660,285 760,400 140,400" fill="#1f7a4d"/>
<text x="450" y="337" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Contratos · 14 pruebas</text>
<text x="450" y="359" fill="#e8f0fa" font-size="11.5" text-anchor="middle">Contrato OpenAPI</text>
<polygon points="140,400 760,400 860,515 40,515" fill="#8a6100"/>
<text x="450" y="452" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Integración · 118 pruebas</text>
<text x="450" y="474" fill="#e8f0fa" font-size="11.5" text-anchor="middle">API contra PostgreSQL</text>
<polygon points="40,515 860,515 860,630 40,630" fill="#5b21b6"/>
<text x="450" y="567" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Unitarias · 37 pruebas</text>
<text x="450" y="589" fill="#e8f0fa" font-size="11.5" text-anchor="middle">Lógica pura, sin base de datos</text>
<rect x="920" y="170" width="420" height="174.5" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="928" y="178" width="6" height="158.5" rx="3" fill="#1f7a4d"/>
<text x="942" y="194.25" fill="#1f7a4d" font-size="13" font-weight="700" text-anchor="start">Qué prueba cada nivel</text>
<text x="942" y="211.25" fill="#4a5568" font-size="11.5" text-anchor="start">E2E (46): navegador Chromium sobre el esquema ggto_e2e.</text>
<text x="942" y="228.25" fill="#4a5568" font-size="11.5" text-anchor="start">Contratos (14): coherencia del OpenAPI publicado con 73</text>
<text x="942" y="245.25" fill="#4a5568" font-size="11.5" text-anchor="start">endpoints.</text>
<text x="942" y="262.25" fill="#4a5568" font-size="11.5" text-anchor="start">Integración (118): la API contra PostgreSQL, esquema ggto_test.</text>
<text x="942" y="279.25" fill="#4a5568" font-size="11.5" text-anchor="start">Unitarias (37): dirección de conexión, reintento progresivo y</text>
<text x="942" y="296.25" fill="#4a5568" font-size="11.5" text-anchor="start">palabras de seguridad.</text>
<text x="942" y="313.25" fill="#4a5568" font-size="11.5" text-anchor="start">Las unitarias siguen corriendo aunque no haya base de datos</text>
<text x="942" y="330.25" fill="#4a5568" font-size="11.5" text-anchor="start">disponible.</text>
<rect x="60" y="680" width="620" height="130" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="68" y="688" width="6" height="114" rx="3" fill="#0b4f9c"/>
<text x="82" y="733" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="start">Total de la Fase 4</text>
<text x="82" y="750" fill="#4a5568" font-size="12" text-anchor="start">169 pruebas pytest + 46 pruebas E2E</text>
<text x="82" y="767" fill="#4a5568" font-size="12" text-anchor="start">215 verificaciones automatizadas en total</text>
<rect x="700" y="680" width="640" height="130" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="708" y="688" width="6" height="114" rx="3" fill="#1f7a4d"/>
<text x="722" y="733" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="start">De dónde sale el esquema</text>
<text x="722" y="750" fill="#4a5568" font-size="12" text-anchor="start">Integración y E2E recrean el esquema desde RepoTecnico/db/schema.sql</text>
<text x="722" y="767" fill="#4a5568" font-size="12" text-anchor="start">con el conftest.py de la batería de pruebas.</text>
</svg>
