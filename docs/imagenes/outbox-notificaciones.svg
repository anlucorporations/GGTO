<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="900" viewBox="0 0 1340 900" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1340" height="900" fill="#ffffff"/>
<rect x="0" y="0" width="1340" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1340" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Bandeja de salida de notificaciones (outbox)</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Nada se pierde: los mensajes se guardan y esperan sus credenciales</text>
<text x="1312" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1312" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="870" width="1340" height="30" fill="#f4f6f9"/>
<text x="670" y="889" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="60" y="110" width="300" height="100" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="60" y="118" width="6" height="84" rx="3" fill="#1f7a4d"/><text x="210" y="147" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">1. Ocurre el evento</text><text x="210" y="165" fill="#4a5568" font-size="12" text-anchor="middle">Falla masiva, despacho publicado,</text><text x="210" y="182" fill="#4a5568" font-size="12" text-anchor="middle">cita o respuesta de Telegram</text>
<path d="M360 160 L440 160" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="440" y="110" width="300" height="100" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="440" y="118" width="6" height="84" rx="3" fill="#0b4f9c"/><text x="590" y="147" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">2. Componer el mensaje</text><text x="590" y="165" fill="#4a5568" font-size="12" text-anchor="middle">notificaciones.py elige el canal:</text><text x="590" y="182" fill="#4a5568" font-size="12" text-anchor="middle">TELEGRAM, CORREO o MCP</text>
<path d="M740 160 L820 160" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="820" y="110" width="300" height="100" rx="10" fill="#ffffff" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="820" y="118" width="6" height="84" rx="3" fill="#8a6100"/><text x="970" y="147" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">3. Encolar en la bandeja</text><text x="970" y="165" fill="#4a5568" font-size="12" text-anchor="middle">Fila en notificacion con estado</text><text x="970" y="182" fill="#4a5568" font-size="12" text-anchor="middle">PENDIENTE e intentos = 0</text>
<path d="M970 210 L970 250 L670 250 L670 290" fill="none" stroke="#8a6100" stroke-width="2" marker-end="url(#flechaAmbar)"/>
<rect x="520" y="290" width="300" height="100" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="520" y="298" width="6" height="84" rx="3" fill="#0b4f9c"/><text x="670" y="327" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">4. Procesar la bandeja</text><text x="670" y="345" fill="#4a5568" font-size="12" text-anchor="middle">outbox.procesar() toma las PENDIENTE</text><text x="670" y="362" fill="#4a5568" font-size="12" text-anchor="middle">cuyo proximo_intento ya venció</text>
<path d="M670 390 L670 440" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="60" y="440" width="1220" height="170" rx="12" fill="#f4f6f9" stroke="#d7dde6" stroke-width="1.5"/><text x="78" y="466" fill="#0b4f9c" font-size="14" font-weight="700">5. Motor de envío: intenta por el canal elegido</text>
<rect x="90" y="490" width="360" height="100" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="90" y="498" width="6" height="84" rx="3" fill="#8a6100"/><text x="270" y="527.5" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">Telegram</text><text x="270" y="545.5" fill="#4a5568" font-size="11.5" text-anchor="middle">Sin credenciales (TELEGRAM_BOT_TOKEN):</text><text x="270" y="562" fill="#4a5568" font-size="11.5" text-anchor="middle">devuelve PENDIENTE con el motivo</text>
<rect x="480" y="490" width="360" height="100" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="480" y="498" width="6" height="84" rx="3" fill="#8a6100"/><text x="660" y="527.5" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">Correo SMTP</text><text x="660" y="545.5" fill="#4a5568" font-size="11.5" text-anchor="middle">Sin credenciales (SMTP_HOST y otras):</text><text x="660" y="562" fill="#4a5568" font-size="11.5" text-anchor="middle">devuelve PENDIENTE con el motivo</text>
<rect x="870" y="490" width="360" height="100" rx="10" fill="#e6f5ec" stroke="#1f7a4d" stroke-width="1.5" filter="url(#sombra)"/><rect x="870" y="498" width="6" height="84" rx="3" fill="#1f7a4d"/><text x="1050" y="527.5" fill="#1f7a4d" font-size="13" font-weight="700" text-anchor="middle">MCP (JSON-RPC)</text><text x="1050" y="545.5" fill="#4a5568" font-size="11.5" text-anchor="middle">Disponible si se presenta</text><text x="1050" y="562" fill="#4a5568" font-size="11.5" text-anchor="middle">la clave mcp.api_key</text>
<path d="M270 590 L270 650" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M660 590 L660 650" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M1050 590 L1050 650" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="90" y="650" width="360" height="110" rx="10" fill="#e6f5ec" stroke="#1f7a4d" stroke-width="1.5" filter="url(#sombra)"/><rect x="90" y="658" width="6" height="94" rx="3" fill="#1f7a4d"/><text x="270" y="692.5" fill="#1f7a4d" font-size="13" font-weight="700" text-anchor="middle">ENVIADO</text><text x="270" y="710.5" fill="#4a5568" font-size="11.5" text-anchor="middle">El canal confirmó el envío;</text><text x="270" y="727" fill="#4a5568" font-size="11.5" text-anchor="middle">se registra la fecha de envío.</text>
<rect x="480" y="650" width="360" height="110" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="480" y="658" width="6" height="94" rx="3" fill="#8a6100"/><text x="660" y="692.5" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">PENDIENTE (reintento)</text><text x="660" y="710.5" fill="#4a5568" font-size="11.5" text-anchor="middle">Sin credenciales o error temporal:</text><text x="660" y="727" fill="#4a5568" font-size="11.5" text-anchor="middle">reintenta con espera progresiva.</text>
<rect x="870" y="650" width="360" height="110" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.5" filter="url(#sombra)"/><rect x="870" y="658" width="6" height="94" rx="3" fill="#b3261e"/><text x="1050" y="692.5" fill="#b3261e" font-size="13" font-weight="700" text-anchor="middle">FALLIDO</text><text x="1050" y="710.5" fill="#4a5568" font-size="11.5" text-anchor="middle">Se alcanzó outbox.max_intentos = 5.</text><text x="1050" y="727" fill="#4a5568" font-size="11.5" text-anchor="middle">Queda en la bandeja para revisión.</text>
<rect x="90" y="790" width="1140" height="70" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><rect x="90" y="798" width="6" height="54" rx="3" fill="#d7dde6"/><text x="112" y="820.5" fill="#4a5568" font-size="12.5" font-weight="700" text-anchor="start">Resumen de la bandeja: pendientes · enviadas · fallidas</text><text x="112" y="838" fill="#4a5568" font-size="11.5" text-anchor="start">WhatsApp no existe en la v1. Telegram y el correo enviarán cuando se carguen sus credenciales; mientras tanto, todo queda PENDIENTE.</text>

</svg>