<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1240" height="810" fill="#ffffff"/>
<rect x="0" y="0" width="1240" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1240" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Flujo de una petición en el backend</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Navegador → middleware → router → servicio → PostgreSQL</text>
<text x="1212" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1212" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="780" width="1240" height="30" fill="#f4f6f9"/>
<text x="620" y="799" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>
<rect x="35" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="35" y="108" width="6" height="36" rx="3" fill="#0b4f9c"/><text x="130" y="130" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">Navegador</text><path d="M130 152 L130 700" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="295" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="295" y="108" width="6" height="36" rx="3" fill="#0b4f9c"/><text x="390" y="130" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">Portero de observabilidad</text><path d="M390 152 L390 700" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="545" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="545" y="108" width="6" height="36" rx="3" fill="#0b4f9c"/><text x="640" y="130" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">Router del tema</text><path d="M640 152 L640 700" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="785" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="785" y="108" width="6" height="36" rx="3" fill="#0b4f9c"/><text x="880" y="130" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">Servicio (reglas)</text><path d="M880 152 L880 700" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="1025" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="1025" y="108" width="6" height="36" rx="3" fill="#0b4f9c"/><text x="1120" y="130" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">PostgreSQL</text><path d="M1120 152 L1120 700" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M132 240 L382 240" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="260" y="232" fill="#08396f" font-size="11.5" font-weight="600" text-anchor="middle">Petición (con o sin X-Request-ID)</text><path d="M 390 276 C 452 248 452 304 390 288" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="464" y="286" fill="#0b4f9c" font-size="11.5" font-weight="600" text-anchor="start">Asignar etiqueta y hora de inicio</text><path d="M392 322 L632 322" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="515" y="314" fill="#08396f" font-size="11.5" font-weight="600" text-anchor="middle">Entregar la petición</text><path d="M 640 356 C 702 328 702 384 640 368" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="714" y="366" fill="#0b4f9c" font-size="11.5" font-weight="600" text-anchor="start">Verificar usuario y permisos</text><path d="M642 402 L872 402" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="760" y="394" fill="#08396f" font-size="11.5" font-weight="600" text-anchor="middle">Delegar la regla de negocio</text><path d="M882 442 L1112 442" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="1000" y="434" fill="#08396f" font-size="11.5" font-weight="600" text-anchor="middle">Consultar o guardar</text><path d="M1118 482 L888 482" fill="none" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaVerde)"/><text x="1000" y="474" fill="#1f7a4d" font-size="11.5" font-weight="600" text-anchor="middle">Datos</text><path d="M878 522 L648 522" fill="none" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaVerde)"/><text x="760" y="514" fill="#1f7a4d" font-size="11.5" font-weight="600" text-anchor="middle">Resultado listo</text><path d="M638 562 L398 562" fill="none" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaVerde)"/><text x="515" y="554" fill="#1f7a4d" font-size="11.5" font-weight="600" text-anchor="middle">Respuesta ordenada</text><path d="M 390 596 C 452 568 452 624 390 608" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="464" y="606" fill="#0b4f9c" font-size="11.5" font-weight="600" text-anchor="start">Calcular milisegundos</text><path d="M388 642 L138 642" fill="none" stroke="#1f7a4d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaVerde)"/><text x="260" y="634" fill="#1f7a4d" font-size="11.5" font-weight="600" text-anchor="middle">Respuesta + X-Request-ID</text><path d="M 390 676 C 452 648 452 704 390 688" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="464" y="686" fill="#0b4f9c" font-size="11.5" font-weight="600" text-anchor="start">Registrar línea en el log</text><rect x="40" y="710" width="1160" height="62" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><rect x="40" y="718" width="6" height="46" rx="3" fill="#d7dde6"/><text x="62" y="744.75" fill="#4a5568" font-size="12.5" font-weight="700" text-anchor="start">Cada respuesta viaja con su X-Request-ID y queda una línea en el registro «ggto» (nivel INFO) con método, ruta, código y milisegundos.</text>
</svg>