<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1400" height="1020" fill="#ffffff"/>
<rect x="0" y="0" width="1400" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1400" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">Orden de los scripts de aprovisionamiento</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13" text-anchor="start">Cadena de RepoTecnico/scripts/ y el punto donde entra la instancia compartida</text>
<text x="1372" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1372" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="990" width="1400" height="30" fill="#f4f6f9"/>
<text x="700" y="1009" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>
<rect x="170" y="110" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="178" y="118" width="6" height="64" rx="3" fill="#0b4f9c"/>
<text x="370" y="146.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">00 · Proyecto y facturación</text>
<text x="370" y="163.5" fill="#4a5568" font-size="11" text-anchor="middle">Proyecto y cuenta de facturación</text>
<rect x="170" y="210" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="178" y="218" width="6" height="64" rx="3" fill="#0b4f9c"/>
<text x="370" y="246.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">01 · Habilitar APIs</text>
<text x="370" y="263.5" fill="#4a5568" font-size="11" text-anchor="middle">Servicios de Google necesarios</text>
<rect x="170" y="310" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="178" y="318" width="6" height="64" rx="3" fill="#0b4f9c"/>
<text x="370" y="346.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">02 · Red privada (VPC, subred, PSA)</text>
<text x="370" y="363.5" fill="#4a5568" font-size="11" text-anchor="middle">Private Service Access</text>
<rect x="170" y="410" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="178" y="418" width="6" height="64" rx="3" fill="#0b4f9c"/>
<text x="370" y="446.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">03 · Cuentas de servicio e IAM</text>
<text x="370" y="463.5" fill="#4a5568" font-size="11" text-anchor="middle">Permisos de mínimo privilegio</text>
<rect x="170" y="510" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="178" y="518" width="6" height="64" rx="3" fill="#0e7490"/>
<text x="370" y="546.5" fill="#0e7490" font-size="13.5" font-weight="700" text-anchor="middle">08 · Auditoría y presupuesto</text>
<text x="370" y="563.5" fill="#4a5568" font-size="11" text-anchor="middle">Registro y tope de gasto</text>
<rect x="810" y="510" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="818" y="518" width="6" height="64" rx="3" fill="#0e7490"/>
<text x="1010" y="546.5" fill="#0e7490" font-size="13.5" font-weight="700" text-anchor="middle">04 · Cloud KMS y Secret Manager</text>
<text x="1010" y="563.5" fill="#4a5568" font-size="11" text-anchor="middle">Claves y secretos cifrados</text>
<rect x="810" y="610" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="818" y="618" width="6" height="64" rx="3" fill="#0e7490"/>
<text x="1010" y="646.5" fill="#0e7490" font-size="13.5" font-weight="700" text-anchor="middle">05 · Bucket seguro y Artifact Registry</text>
<text x="1010" y="663.5" fill="#4a5568" font-size="11" text-anchor="middle">Almacenamiento e imágenes</text>
<rect x="810" y="710" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="818" y="718" width="6" height="64" rx="3" fill="#1f7a4d"/>
<text x="1010" y="746.5" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">06 · Cloud SQL propio ggtov2-pg</text>
<text x="1010" y="763.5" fill="#4a5568" font-size="11" text-anchor="middle">Backups, PITR 7 días, inicio 03:00</text>
<rect x="810" y="810" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="818" y="818" width="6" height="64" rx="3" fill="#4a5568"/>
<text x="1010" y="846.5" fill="#4a5568" font-size="13.5" font-weight="700" text-anchor="middle">07 · Cloud Run ggtov2-web</text>
<text x="1010" y="863.5" fill="#4a5568" font-size="11" text-anchor="middle">Comentado en el orquestador</text>
<rect x="170" y="800" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="178" y="808" width="6" height="64" rx="3" fill="#8a6100"/>
<text x="370" y="836.5" fill="#8a6100" font-size="13.5" font-weight="700" text-anchor="middle">10 · Base y usuario ggtov2</text>
<text x="370" y="853.5" fill="#4a5568" font-size="11" text-anchor="middle">En la instancia compartida truekeate-db-dev</text>
<rect x="600" y="880" width="320" height="80" rx="10" fill="#fdecea" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="608" y="888" width="6" height="64" rx="3" fill="#b3261e"/>
<text x="760" y="916.5" fill="#b3261e" font-size="13.5" font-weight="700" text-anchor="middle">99 · Teardown controlado</text>
<text x="760" y="933.5" fill="#4a5568" font-size="11" text-anchor="middle">Borra lo creado por el proyecto</text>
<path d="M370 190 L370 210" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M370 290 L370 310" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M370 390 L370 410" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M370 490 L370 510" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M570 550 L810 550" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="690" y="541" fill="#0e7490" font-size="11" font-weight="700" text-anchor="middle">CREAR_RECURSOS=si</text>
<path d="M1010 590 L1010 610" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M1010 690 L1010 710" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M1010 790 L1010 810" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M170 450 L110 450 L110 840 L170 840" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M370 880 L370 920 L600 920" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M810 850 L760 850 L760 880" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="620" y="110" width="340" height="125" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="628" y="118" width="6" height="109" rx="3" fill="#0b4f9c"/>
<text x="642" y="135" fill="#0b4f9c" font-size="13" font-weight="700" text-anchor="start">Cómo se orquesta</text>
<text x="642" y="152" fill="#4a5568" font-size="11.5" text-anchor="start">provision_all.sh recorre los scripts en orden y</text>
<text x="642" y="169" fill="#4a5568" font-size="11.5" text-anchor="start">lib_gcp.sh aporta la biblioteca común (token y</text>
<text x="642" y="186" fill="#4a5568" font-size="11.5" text-anchor="start">ayudante api).</text>
<text x="642" y="203" fill="#4a5568" font-size="11.5" text-anchor="start">El orden importa: cada script reutiliza lo que creó</text>
<text x="642" y="220" fill="#4a5568" font-size="11.5" text-anchor="start">el anterior.</text>
<rect x="1000" y="110" width="340" height="125" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="1008" y="118" width="6" height="109" rx="3" fill="#0b4f9c"/>
<text x="1022" y="135" fill="#0b4f9c" font-size="13" font-weight="700" text-anchor="start">Requisitos</text>
<text x="1022" y="152" fill="#4a5568" font-size="11.5" text-anchor="start">Requiere gcloud autenticado y</text>
<text x="1022" y="169" fill="#4a5568" font-size="11.5" text-anchor="start">CREAR_RECURSOS=si para crear KMS, secretos,</text>
<text x="1022" y="186" fill="#4a5568" font-size="11.5" text-anchor="start">bucket, Cloud SQL y Cloud Run.</text>
<text x="1022" y="203" fill="#4a5568" font-size="11.5" text-anchor="start">El script 07 está comentado: el servicio real se</text>
<text x="1022" y="220" fill="#4a5568" font-size="11.5" text-anchor="start">desplegó a mano.</text>
<rect x="620" y="300" width="720" height="92" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="628" y="308" width="6" height="76" rx="3" fill="#0b4f9c"/>
<text x="642" y="325.5" fill="#0b4f9c" font-size="13" font-weight="700" text-anchor="start">Contenido de la carpeta</text>
<text x="642" y="342.5" fill="#4a5568" font-size="11.5" text-anchor="start">RepoTecnico/scripts/ tiene trece archivos: el orquestador, la biblioteca común, los scripts 00 a 10 y el teardown 99.</text>
<text x="642" y="359.5" fill="#4a5568" font-size="11.5" text-anchor="start">El script 06 crea la instancia propia ggtov2-pg con respaldos y PITR; el 10 usa la instancia compartida</text>
<text x="642" y="376.5" fill="#4a5568" font-size="11.5" text-anchor="start">truekeate-db-dev, que no los tiene (riesgo aceptado D-26).</text>
</svg>
