<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1200" height="780" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1200" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Arquitectura general de GGTO</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Personas · servicio en la nube · base de datos · canales externos</text>
<text x="1172" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1172" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="750" width="1200" height="30" fill="#f4f6f9"/>
<text x="600" y="769" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="60" y="96" width="780" height="140" rx="12" fill="#f4f6f9" stroke="#d7dde6" stroke-width="1.5"/><text x="78" y="122" fill="#0b4f9c" font-size="14" font-weight="700">Personas</text>
<rect x="90" y="136" width="340" height="76" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="90" y="144" width="6" height="60" rx="3" fill="#0b4f9c"/><text x="112" y="170" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">Supervisor / Administrador</text><text x="112" y="189" fill="#4a5568" font-size="12" text-anchor="start">Entra con el navegador web</text>
<rect x="460" y="136" width="350" height="76" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="460" y="144" width="6" height="60" rx="3" fill="#0b4f9c"/><text x="482" y="170" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">Técnico de campo</text><text x="482" y="189" fill="#4a5568" font-size="12" text-anchor="start">Navegador web (móvil y Telegram, a futuro)</text>
<path d="M450 236 L450 272" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="60" y="272" width="780" height="200" rx="12" fill="#e8f0fa" stroke="#0b4f9c" stroke-width="1.5"/><text x="78" y="298" fill="#0b4f9c" font-size="14" font-weight="700">Un solo servicio en la nube (Cloud Run ggto-web)</text>
<rect x="90" y="320" width="320" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="90" y="328" width="6" height="94" rx="3" fill="#0b4f9c"/><text x="250" y="362.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Web React (SPA)</text><text x="250" y="381.5" fill="#4a5568" font-size="12" text-anchor="middle">Pantallas del sistema,</text><text x="250" y="398.5" fill="#4a5568" font-size="12" text-anchor="middle">compiladas en app/web/dist</text>
<rect x="490" y="320" width="320" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="490" y="328" width="6" height="94" rx="3" fill="#0b4f9c"/><text x="650" y="362.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Backend FastAPI</text><text x="650" y="381.5" fill="#4a5568" font-size="12" text-anchor="middle">Reglas de negocio, validación</text><text x="650" y="398.5" fill="#4a5568" font-size="12" text-anchor="middle">y acceso a los datos</text>
<path d="M410 375 L490 375" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="450" y="352" fill="#0b4f9c" font-size="10" font-weight="600" text-anchor="middle">misma</text>
<text x="450" y="364" fill="#0b4f9c" font-size="10" font-weight="600" text-anchor="middle">dirección</text>
<path d="M400 472 L400 520" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="210" y="520" width="480" height="110" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.5" filter="url(#sombra)"/><rect x="210" y="528" width="6" height="94" rx="3" fill="#1f7a4d"/><text x="450" y="562.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL 15</text><text x="450" y="581.5" fill="#4a5568" font-size="12" text-anchor="middle">Base ggtov2 · 35 tablas · Cloud SQL</text><text x="450" y="598.5" fill="#4a5568" font-size="12" text-anchor="middle">RLS activa en caso y despacho</text>
<rect x="880" y="96" width="280" height="534" rx="12" fill="#f4f6f9" stroke="#d7dde6" stroke-width="1.5"/><text x="898" y="122" fill="#0b4f9c" font-size="14" font-weight="700">Canales hacia afuera</text>
<rect x="905" y="140" width="230" height="120" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="905" y="148" width="6" height="104" rx="3" fill="#8a6100"/><text x="1020" y="178.5" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">Telegram</text><text x="1020" y="196.5" fill="#4a5568" font-size="12" text-anchor="middle">Sin credenciales:</text><text x="1020" y="213.5" fill="#4a5568" font-size="12" text-anchor="middle">los envíos quedan</text><text x="1020" y="230.5" fill="#4a5568" font-size="12" text-anchor="middle">PENDIENTE</text>
<rect x="905" y="290" width="230" height="120" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="905" y="298" width="6" height="104" rx="3" fill="#8a6100"/><text x="1020" y="328.5" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">Correo SMTP</text><text x="1020" y="346.5" fill="#4a5568" font-size="12" text-anchor="middle">Sin credenciales:</text><text x="1020" y="363.5" fill="#4a5568" font-size="12" text-anchor="middle">los envíos quedan</text><text x="1020" y="380.5" fill="#4a5568" font-size="12" text-anchor="middle">PENDIENTE</text>
<rect x="905" y="440" width="230" height="120" rx="10" fill="#e6f5ec" stroke="#1f7a4d" stroke-width="1.5" filter="url(#sombra)"/><rect x="905" y="448" width="6" height="104" rx="3" fill="#1f7a4d"/><text x="1020" y="487" fill="#1f7a4d" font-size="13" font-weight="700" text-anchor="middle">MCP (JSON-RPC)</text><text x="1020" y="505" fill="#4a5568" font-size="12" text-anchor="middle">Servicio disponible</text><text x="1020" y="522" fill="#4a5568" font-size="12" text-anchor="middle">con la clave mcp.api_key</text>
<path d="M810 330 L850 330 L850 200 L905 200" fill="none" stroke="#8a6100" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaAmbar)"/>
<path d="M810 360 L872 360 L872 350 L905 350" fill="none" stroke="#8a6100" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaAmbar)"/>
<path d="M905 500 L840 500 L840 390 L810 390" fill="none" stroke="#1f7a4d" stroke-width="2" marker-end="url(#flechaVerde)"/>
<rect x="60" y="650" width="780" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><rect x="60" y="658" width="6" height="74" rx="3" fill="#d7dde6"/><text x="82" y="682.5" fill="#4a5568" font-size="14" font-weight="700" text-anchor="start">Nota importante</text><text x="82" y="701.5" fill="#4a5568" font-size="12" text-anchor="start">Telegram y el correo aún no envían: se guardan como PENDIENTES (patrón outbox).</text><text x="82" y="718.5" fill="#4a5568" font-size="12" text-anchor="start">WhatsApp no existe en la v1 y la app móvil Flutter no está desarrollada.</text>

</svg>