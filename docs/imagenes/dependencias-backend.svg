" text-anchor="middle">Lee la configuración</text><rect x="370" y="265" width="280" height="100" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="370" y="273" width="6" height="84" rx="3" fill="#0b4f9c"/><text x="510" y="311" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">argon2-cffi</text><text x="510" y="330" fill="#4a5568" font-size="12" text-anchor="middle">Protege claves y palabras</text><rect x="670" y="265" width="280" height="100" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="670" y="273" width="6" height="84" rx="3" fill="#0b4f9c"/><text x="810" y="311" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">PyJWT</text><text x="810" y="330" fill="#4a5568" font-size="12" text-anchor="middle">Crea el pase de sesión</text><rect x="970" y="265" width="280" height="100" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="970" y="273" width="6" height="84" rx="3" fill="#0b4f9c"/><text x="1110" y="311" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">python-multipart</text><text x="1110" y="330" fill="#4a5568" font-size="12" text-anchor="middle">Recibe el archivo CSV</text>
