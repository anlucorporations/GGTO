<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Mapa de secciones de la plataforma</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Una sola pantalla pública y todas las secciones internas</text>
<text x="1332" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1332" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="910" width="1360" height="30" fill="#f4f6f9"/>
<text x="680" y="929" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="60" y="520" width="480" height="350" rx="12" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="8 5"/><text x="78" y="546" fill="#08396f" font-size="14" font-weight="700">Atajos y reglas de navegación</text>
<text x="86" y="576" fill="#4a5568" font-size="12.5" font-weight="400" text-anchor="start">• Si escribes una dirección que no existe, el sistema</text>
<text x="86" y="596" fill="#4a5568" font-size="12.5" font-weight="400" text-anchor="start">  te devuelve al PANEL (no hay pantalla de error).</text>
<text x="86" y="628" fill="#4a5568" font-size="12.5" font-weight="400" text-anchor="start">• El menú CONFIGURACIÓN solo lo ven SUPER, ADMIN</text>
<text x="86" y="648" fill="#4a5568" font-size="12.5" font-weight="400" text-anchor="start">  y SUPERVISOR. Si eres TECNICO no aparece.</text>
<text x="86" y="680" fill="#4a5568" font-size="12.5" font-weight="400" text-anchor="start">• Módulos transversales (sin menú propio):</text>
<text x="86" y="700" fill="#4a5568" font-size="12.5" font-weight="400" text-anchor="start">  INGESTA · GESTIÓN AUTOMATIZADA · GESTIÓN TÉCNICA</text>
<text x="86" y="720" fill="#4a5568" font-size="12.5" font-weight="400" text-anchor="start">  ALERTAS · SEGURIDAD · REPORTES · INSUMOS (v2).</text>
<text x="86" y="752" fill="#1f7a4d" font-size="12.5" font-weight="600" text-anchor="start">• Enlaces internos compartibles (deep links):</text>
<text x="86" y="772" fill="#4a5568" font-size="12.5" font-weight="400" text-anchor="start">  recargar /monitoreo o /casos/123 funciona igual.</text>
