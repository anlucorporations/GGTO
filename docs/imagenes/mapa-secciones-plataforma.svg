xt><text x="722" y="437" fill="#4a5568" font-size="12" text-anchor="start">Empresas, referidos y gobiernos</text><path d="M600 512 L700 512" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><rect x="700" y="480" width="280" height="64" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="700" y="488" width="6" height="48" rx="3" fill="#d7dde6"/><text x="722" y="508" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">AGENDA /agenda</text><text x="722" y="527" fill="#4a5568" font-size="12" text-anchor="start">Citas de contacto y atención</text><path d="M600 602 L700 602" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><rect x="700" y="570" width="280" height="64" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="700" y="578" width="6" height="48" rx="3" fill="#d7dde6"/><text x="722" y="598" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">MONITOREO /monitoreo</text><text x="722" y="617" fill="#4a5568" font-size="12" text-anchor="start">Métricas y gráficos de gestión</text><path d="M600 692 L700 692" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><rect x="700" y="660" width="280" height="64" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="700" y="668" width="6" height="48" rx="3" fill="#d7dde6"/><text x="722" y="688" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">ALERTAS /alertas</text><text x="722" y="707" fill="#4a5568" font-size="12" text-anchor="start">Bandeja de notificaciones y fallas</text>
