<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1080" height="900" fill="#ffffff"/>
<rect x="0" y="0" width="1080" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1080" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Onboarding del técnico: primeros 5 pasos</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Cómo entrar a GGTO y ubicarse en la plataforma</text>
<text x="1052" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1052" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="870" width="1080" height="30" fill="#f4f6f9"/>
<text x="540" y="889" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="190" y="100" width="470" height="68" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="190" y="108" width="6" height="52" rx="3" fill="#0b4f9c"/><text x="212" y="130" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">1. Abrir el sistema</text><text x="212" y="149" fill="#4a5568" font-size="12" text-anchor="start">en el navegador (Chrome, Edge o Firefox)</text>
<path d="M425 168 L425 196" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="190" y="196" width="470" height="68" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="190" y="204" width="6" height="52" rx="3" fill="#0b4f9c"/><text x="212" y="226" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">2. Entrar con tu P00 y tu clave personal</text><text x="212" y="245" fill="#4a5568" font-size="12" text-anchor="start">El P00 es tu código de personal, por ejemplo P00123</text>
<path d="M425 264 L425 300" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<polygon points="425,300 587,364 425,428 263,364" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><text x="425" y="361" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">3. ¿Tres intentos</text><text x="425" y="377" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">fallidos?</text>
<path d="M425 428 L425 506" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="440" y="470" fill="#0b4f9c" font-size="11" font-weight="600" text-anchor="start">No</text>
<path d="M587 364 L700 364" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="644" y="354" fill="#0b4f9c" font-size="11" font-weight="600" text-anchor="middle">Sí</text>
<rect x="700" y="316" width="340" height="96" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.5" filter="url(#sombra)"/><rect x="700" y="324" width="6" height="80" rx="3" fill="#b3261e"/><text x="870" y="351.5" fill="#b3261e" font-size="14" font-weight="700" text-anchor="middle">Cuenta bloqueada</text><text x="870" y="370.5" fill="#4a5568" font-size="12" text-anchor="middle">Se desbloquea con 3 de tus</text><text x="870" y="387.5" fill="#4a5568" font-size="12" text-anchor="middle">12 palabras de seguridad</text>
<path d="M870 412 L870 486 L520 486 L520 506" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#flechaRojo)"/>
<rect x="190" y="506" width="470" height="96" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="190" y="514" width="6" height="80" rx="3" fill="#0b4f9c"/><text x="212" y="541.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">4. Ubicar la barra de secciones</text><text x="212" y="560.5" fill="#4a5568" font-size="12" text-anchor="start">PANEL · CASOS · ESPECIALES · AGENDA · DESPACHO</text><text x="212" y="577.5" fill="#4a5568" font-size="12" text-anchor="start">INGESTA · MONITOREO · ALERTAS   (+ CONFIGURACIÓN según rol)</text>
<path d="M425 602 L425 634" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="190" y="634" width="470" height="68" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="190" y="642" width="6" height="52" rx="3" fill="#0b4f9c"/><text x="212" y="664" fill="#08396f" font-size="14" font-weight="700" text-anchor="start">5. Revisar el PANEL y abrir CASOS</text><text x="212" y="683" fill="#4a5568" font-size="12" text-anchor="start">Resumen del día y botón «Agregar caso»</text>
<path d="M425 702 L425 740 L330 740 L330 776" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M425 740 L560 740 L560 776" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="150" y="776" width="300" height="76" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="150" y="784" width="6" height="60" rx="3" fill="#1f7a4d"/><text x="300" y="800.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Buscar con el</text><text x="300" y="819.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">buscador global</text><text x="300" y="838.5" fill="#4a5568" font-size="12" text-anchor="middle">(está en la barra superior)</text>
<rect x="460" y="776" width="300" height="76" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="460" y="784" width="6" height="60" rx="3" fill="#1f7a4d"/><text x="610" y="800.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Crear un caso con</text><text x="610" y="819.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">«Agregar caso»</text><text x="610" y="838.5" fill="#4a5568" font-size="12" text-anchor="middle">(alta manual desde CASOS)</text>
<text x="60" y="862" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">La clave nunca se comparte. El bloqueo a los 3 intentos es una protección, no un fallo.</text>

</svg>