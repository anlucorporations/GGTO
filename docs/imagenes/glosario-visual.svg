<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1400" height="930" fill="#ffffff"/>
<rect x="0" y="0" width="1400" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1400" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Glosario visual de GGTO</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Dieciséis términos para entender el sistema sin jerga</text>
<text x="1372" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1372" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="900" width="1400" height="30" fill="#f4f6f9"/>
<text x="700" y="919" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>
<rect x="50" y="110" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="50" y="118" width="6" height="164" rx="3" fill="#0b4f9c"/><text x="72" y="150" fill="#0b4f9c" font-size="17" font-weight="700" text-anchor="start">P00</text><text x="72" y="182" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Código de personal del usuario. Es el</text><text x="72" y="201" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">nombre de usuario para entrar al</text><text x="72" y="220" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">sistema.</text><rect x="390" y="110" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="390" y="118" width="6" height="164" rx="3" fill="#1f7a4d"/><text x="412" y="150" fill="#1f7a4d" font-size="17" font-weight="700" text-anchor="start">GPON</text><text x="412" y="182" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Red óptica pasiva: la tecnología de</text><text x="412" y="201" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">fibra que opera la central.</text><rect x="730" y="110" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="730" y="118" width="6" height="164" rx="3" fill="#0e7490"/><text x="752" y="150" fill="#0e7490" font-size="17" font-weight="700" text-anchor="start">OLT</text><text x="752" y="182" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Equipo de la central que concentra la</text><text x="752" y="201" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">fibra hacia los clientes.</text><rect x="1070" y="110" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="1070" y="118" width="6" height="164" rx="3" fill="#5b21b6"/><text x="1092" y="150" fill="#5b21b6" font-size="17" font-weight="700" text-anchor="start">FAT</text><text x="1092" y="182" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Caja de distribución óptica en la</text><text x="1092" y="201" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">calle, cerca del cliente.</text><rect x="50" y="310" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="50" y="318" width="6" height="164" rx="3" fill="#1f7a4d"/><text x="72" y="350" fill="#1f7a4d" font-size="17" font-weight="700" text-anchor="start">ONT</text><text x="72" y="382" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Equipo que recibe la fibra en el</text><text x="72" y="401" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">domicilio del cliente.</text><rect x="390" y="310" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="390" y="318" width="6" height="164" rx="3" fill="#0e7490"/><text x="412" y="350" fill="#0e7490" font-size="17" font-weight="700" text-anchor="start">Avería</text><text x="412" y="382" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Reporte de falla GPON que entra por el</text><text x="412" y="401" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">archivo CSV diario.</text><rect x="730" y="310" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="730" y="318" width="6" height="164" rx="3" fill="#5b21b6"/><text x="752" y="350" fill="#5b21b6" font-size="17" font-weight="700" text-anchor="start">Caso</text><text x="752" y="382" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Unidad de trabajo: avería, reparación</text><text x="752" y="401" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">o construcción.</text><rect x="1070" y="310" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="1070" y="318" width="6" height="164" rx="3" fill="#0b4f9c"/><text x="1092" y="350" fill="#0b4f9c" font-size="17" font-weight="700" text-anchor="start">Sector</text><text x="1092" y="382" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Zona de trabajo con direcciones</text><text x="1092" y="401" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">asociadas; ubica el caso.</text><rect x="50" y="510" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="50" y="518" width="6" height="164" rx="3" fill="#0e7490"/><text x="72" y="550" fill="#0e7490" font-size="17" font-weight="700" text-anchor="start">Cuadrilla</text><text x="72" y="582" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Equipo de técnicos con vehículo y</text><text x="72" y="601" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">herramientas asignadas.</text><rect x="390" y="510" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="390" y="518" width="6" height="164" rx="3" fill="#5b21b6"/><text x="412" y="550" fill="#5b21b6" font-size="17" font-weight="700" text-anchor="start">Cuadrilla 0</text><text x="412" y="582" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Casos en gestión del supervisor,</text><text x="412" y="601" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">excluidos del despacho de calle.</text><rect x="730" y="510" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="730" y="518" width="6" height="164" rx="3" fill="#0b4f9c"/><text x="752" y="550" fill="#0b4f9c" font-size="17" font-weight="700" text-anchor="start">Despacho</text><text x="752" y="582" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Reparto del trabajo del día entre las</text><text x="752" y="601" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">cuadrillas.</text><rect x="1070" y="510" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="1070" y="518" width="6" height="164" rx="3" fill="#1f7a4d"/><text x="1092" y="550" fill="#1f7a4d" font-size="17" font-weight="700" text-anchor="start">Outbox</text><text x="1092" y="582" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Bandeja de salida donde se guarda lo</text><text x="1092" y="601" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">que se quiere notificar.</text><rect x="50" y="710" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="50" y="718" width="6" height="164" rx="3" fill="#5b21b6"/><text x="72" y="750" fill="#5b21b6" font-size="17" font-weight="700" text-anchor="start">Lote de ingesta</text><text x="72" y="782" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Registro de una carga del CSV:</text><text x="72" y="801" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">PROCESANDO, OK o ERROR.</text><rect x="390" y="710" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="390" y="718" width="6" height="164" rx="3" fill="#0b4f9c"/><text x="412" y="750" fill="#0b4f9c" font-size="17" font-weight="700" text-anchor="start">RBAC</text><text x="412" y="782" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Control de acceso por roles: SUPER,</text><text x="412" y="801" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">ADMIN, SUPERVISOR y TECNICO.</text><rect x="730" y="710" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="730" y="718" width="6" height="164" rx="3" fill="#1f7a4d"/><text x="752" y="750" fill="#1f7a4d" font-size="17" font-weight="700" text-anchor="start">RLS</text><text x="752" y="782" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Seguridad por filas: limita lo visible</text><text x="752" y="801" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">según la central del usuario.</text><rect x="1070" y="710" width="310" height="180" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="1070" y="718" width="6" height="164" rx="3" fill="#0e7490"/><text x="1092" y="750" fill="#0e7490" font-size="17" font-weight="700" text-anchor="start">X-Request-ID</text><text x="1092" y="782" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">Etiqueta única que permite rastrear</text><text x="1092" y="801" fill="#4a5568" font-size="12" font-weight="400" text-anchor="start">una petición en los registros.</text>
</svg>