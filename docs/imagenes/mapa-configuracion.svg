<text x="790" y="374" fill="#1f7a4d" font-size="11" font-weight="700" text-anchor="middle">cuadrillas</text>
<path d="M1060 336 L1060 430" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="1072" y="386" fill="#1f7a4d" font-size="11" font-weight="700" text-anchor="start">causas</text>
<rect x="60" y="570" width="620" height="75.5" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/>
<rect x="68" y="578" width="6" height="59.5" rx="3" fill="#d7dde6"/>
<text x="82" y="595.75" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">RBAC de escritura</text>
<text x="82" y="612.75" fill="#4a5568" font-size="11.5" text-anchor="start">Las lecturas piden una sesión válida; las escrituras piden rol ADMIN o SUPERVISOR y SUPER</text>
<text x="82" y="629.75" fill="#4a5568" font-size="11.5" text-anchor="start">siempre pasa la autorización.</text>
<rect x="700" y="570" width="640" height="92" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/>
<rect x="708" y="578" width="6" height="76" rx="3" fill="#d7dde6"/>
<text x="722" y="595.5" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">Catálogos y parámetros</text>
<text x="722" y="612.5" fill="#4a5568" font-size="11.5" text-anchor="start">configuracion guarda 22 parámetros de clave y valor; catalogo_metodo tiene 9 filas; rol tiene 4 y</text>
<text x="722" y="629.5" fill="#4a5568" font-size="11.5" text-anchor="start">causa es administrable (no se carga desde el CSV).</text>
<text x="722" y="646.5" fill="#4a5568" font-size="11.5" text-anchor="start">La carga es idempotente: repetirla no duplica filas.</text>
