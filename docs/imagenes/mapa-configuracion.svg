<text x="700" y="507" fill="#4a5568" font-size="12" text-anchor="middle">con las cuadrillas cargadas</text>
<rect x="880" y="430" width="360" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="888" y="438" width="6" height="94" rx="3" fill="#1f7a4d"/>
