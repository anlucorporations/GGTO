<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1320" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1320" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1320" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Dependencias del frontend GGTO</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Tres programas de ejecución, cinco de desarrollo y lo que no se usa</text>
<text x="1292" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1292" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="770" width="1320" height="30" fill="#f4f6f9"/>
<text x="660" y="789" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="40" y="96" width="1240" height="230" rx="12" fill="#f4f6f9" stroke="#d7dde6" stroke-width="1.5"/><text x="58" y="122" fill="#0b4f9c" font-size="14" font-weight="700">Programas para que la web funcione (solo tres)</text>
<rect x="90" y="150" width="360" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="90" y="158" width="6" height="94" rx="3" fill="#0b4f9c"/><text x="270" y="201" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">react</text><text x="270" y="220" fill="#4a5568" font-size="12" text-anchor="middle">Construye las pantallas</text><rect x="480" y="150" width="360" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="480" y="158" width="6" height="94" rx="3" fill="#0b4f9c"/><text x="660" y="201" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">react-dom</text><text x="660" y="220" fill="#4a5568" font-size="12" text-anchor="middle">Las muestra en el navegador</text><rect x="870" y="150" width="360" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="870" y="158" width="6" height="94" rx="3" fill="#0b4f9c"/><text x="1050" y="201" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">react-router-dom</text><text x="1050" y="220" fill="#4a5568" font-size="12" text-anchor="middle">Cambia de pantalla sin recargar</text>
<rect x="40" y="350" width="610" height="380" rx="12" fill="#f4f6f9" stroke="#d7dde6" stroke-width="1.5"/><text x="58" y="376" fill="#0b4f9c" font-size="14" font-weight="700">Programas del equipo técnico (cinco)</text>
<rect x="70" y="400" width="270" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="70" y="408" width="6" height="74" rx="3" fill="#1f7a4d"/><text x="205" y="440.5" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">typescript</text><text x="205" y="458.5" fill="#4a5568" font-size="12" text-anchor="middle">Revisa los tipos</text><rect x="370" y="400" width="270" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="370" y="408" width="6" height="74" rx="3" fill="#1f7a4d"/><text x="505" y="440.5" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">vite</text><text x="505" y="458.5" fill="#4a5568" font-size="12" text-anchor="middle">Arma y compila la web</text><rect x="70" y="510" width="270" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="70" y="518" width="6" height="74" rx="3" fill="#1f7a4d"/><text x="205" y="550.5" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">@vitejs/plugin-react</text><text x="205" y="568.5" fill="#4a5568" font-size="12" text-anchor="middle">Entiende el formato React</text><rect x="370" y="510" width="270" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="370" y="518" width="6" height="74" rx="3" fill="#1f7a4d"/><text x="505" y="550.5" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">@types/react</text><text x="505" y="568.5" fill="#4a5568" font-size="12" text-anchor="middle">Tipos de React</text><rect x="220" y="620" width="270" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="220" y="628" width="6" height="74" rx="3" fill="#1f7a4d"/><text x="355" y="660.5" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">@types/react-dom</text><text x="355" y="678.5" fill="#4a5568" font-size="12" text-anchor="middle">Tipos de React DOM</text>
<rect x="670" y="350" width="610" height="380" rx="12" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="8 5"/><text x="688" y="376" fill="#b3261e" font-size="14" font-weight="700">Lo que NO se usa (verificado)</text>
<rect x="700" y="398" width="550" height="66" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/><rect x="700" y="406" width="6" height="50" rx="3" fill="#b3261e"/><text x="722" y="426.75" fill="#b3261e" font-size="13" font-weight="700" text-anchor="start">✗  Recharts / Chart.js</text><text x="722" y="444.75" fill="#4a5568" font-size="11.5" text-anchor="start">Los gráficos SVG se dibujan a mano</text><rect x="700" y="478" width="550" height="66" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/><rect x="700" y="486" width="6" height="50" rx="3" fill="#b3261e"/><text x="722" y="506.75" fill="#b3261e" font-size="13" font-weight="700" text-anchor="start">✗  axios</text><text x="722" y="524.75" fill="#4a5568" font-size="11.5" text-anchor="start">Se usa fetch, que ya viene en el navegador</text><rect x="700" y="558" width="550" height="66" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/><rect x="700" y="566" width="6" height="50" rx="3" fill="#b3261e"/><text x="722" y="586.75" fill="#b3261e" font-size="13" font-weight="700" text-anchor="start">✗  Redux / Zustand / MobX</text><text x="722" y="604.75" fill="#4a5568" font-size="11.5" text-anchor="start">El estado se maneja con un contexto propio</text><rect x="700" y="638" width="550" height="66" rx="10" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/><rect x="700" y="646" width="6" height="50" rx="3" fill="#b3261e"/><text x="722" y="666.75" fill="#b3261e" font-size="13" font-weight="700" text-anchor="start">✗  Librería de componentes</text><text x="722" y="684.75" fill="#4a5568" font-size="11.5" text-anchor="start">La apariencia usa una hoja de estilos propia</text>

</svg>