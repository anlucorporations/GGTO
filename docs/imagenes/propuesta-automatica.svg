<path d="M1050 333 L1020 333" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M720 333 L690 333" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M390 333 L360 333" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M210 376 L210 470" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="224" y="426" fill="#0e7490" font-size="11" font-weight="700" text-anchor="start">Sí</text>
<path d="M360 355 L480 355 L480 440 L540 440 L540 470" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="420" y="347" fill="#0b4f9c" font-size="11" font-weight="700" text-anchor="middle">No</text>
<path d="M360 513 L390 513" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M690 513 L720 513" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="60" y="610" width="1280" height="230" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="60" y="618" width="6" height="214" rx="3" fill="#d7dde6"/>
<text x="82" y="646" fill="#0b4f9c" font-size="14" font-weight="700" text-anchor="start">Reglas que informa la propuesta</text>
<text x="82" y="682" fill="#08396f" font-size="11.5" font-weight="700" text-anchor="start">citados_incluidos</text>
<text x="82" y="699" fill="#4a5568" font-size="11" text-anchor="start">Casos que entraron por tener cita del día.</text>
<text x="82" y="742" fill="#08396f" font-size="11.5" font-weight="700" text-anchor="start">referidos_asignados / referidos_disponibles / min_referidos</text>
<text x="82" y="759" fill="#4a5568" font-size="11" text-anchor="start">Referidos asignados frente al mínimo 2.</text>
<text x="82" y="802" fill="#08396f" font-size="11.5" font-weight="700" text-anchor="start">cumple_min_referidos</text>
<text x="82" y="819" fill="#4a5568" font-size="11" text-anchor="start">Se cumple si los referidos asignados llegan al mínimo.</text>
<text x="742" y="682" fill="#08396f" font-size="11.5" font-weight="700" text-anchor="start">empresas_asignadas / empresas_disponibles / min_empresas</text>
<text x="742" y="699" fill="#4a5568" font-size="11" text-anchor="start">Empresas (y gobierno) frente al mínimo 1.</text>
<text x="742" y="742" fill="#08396f" font-size="11.5" font-weight="700" text-anchor="start">cumple_min_empresas</text>
<text x="742" y="759" fill="#4a5568" font-size="11" text-anchor="start">Se cumple si las empresas asignadas llegan al mínimo.</text>
<text x="742" y="802" fill="#08396f" font-size="11.5" font-weight="700" text-anchor="start">construccion_cuadrilla / construccion_en_una_sola</text>
<text x="742" y="819" fill="#4a5568" font-size="11" text-anchor="start">Cuadrilla única de construcción y si se logró.</text>
</svg>
