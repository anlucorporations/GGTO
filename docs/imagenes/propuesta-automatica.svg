<rect width="1400" height="900" fill="#ffffff"/>
<rect x="0" y="0" width="1400" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1400" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">Propuesta automática de despacho</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13" text-anchor="start">Los filtros, el orden y las reglas que arma el motor antes de generar el despacho</text>
<text x="1372" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1372" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="870" width="1400" height="30" fill="#f4f6f9"/>
<text x="700" y="889" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>
<rect x="60" y="110" width="300" height="86" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="68" y="118" width="6" height="70" rx="3" fill="#0b4f9c"/>
<text x="210" y="149.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Universo de casos</text>
<text x="210" y="166.5" fill="#4a5568" font-size="11" text-anchor="middle">de la central</text>
<rect x="390" y="110" width="300" height="86" rx="10" fill="#fff4d6" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="398" y="118" width="6" height="70" rx="3" fill="#8a6100"/>
<text x="540" y="149.5" fill="#8a6100" font-size="13.5" font-weight="700" text-anchor="middle">Quitar CERRADO,</text>
<text x="540" y="166.5" fill="#4a5568" font-size="11" text-anchor="middle">CANCELADO y ENRUTADO</text>
<rect x="720" y="110" width="300" height="86" rx="10" fill="#fff4d6" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="728" y="118" width="6" height="70" rx="3" fill="#8a6100"/>
<text x="870" y="149.5" fill="#8a6100" font-size="13.5" font-weight="700" text-anchor="middle">Quitar cuadrilla 0</text>
<text x="870" y="166.5" fill="#4a5568" font-size="11" text-anchor="middle">salvo cita del día</text>
<rect x="1050" y="110" width="300" height="86" rx="10" fill="#fff4d6" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="1058" y="118" width="6" height="70" rx="3" fill="#8a6100"/>
<text x="1200" y="149.5" fill="#8a6100" font-size="13.5" font-weight="700" text-anchor="middle">Quitar ya asignados</text>
<text x="1200" y="166.5" fill="#4a5568" font-size="11" text-anchor="middle">a despacho abierto</text>
<rect x="1050" y="290" width="300" height="86" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="1058" y="298" width="6" height="70" rx="3" fill="#0b4f9c"/>
<text x="1200" y="329.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Agrupar por sector</text>
<text x="1200" y="346.5" fill="#4a5568" font-size="11" text-anchor="middle">Un grupo por sector</text>
<rect x="720" y="290" width="300" height="86" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="728" y="298" width="6" height="70" rx="3" fill="#0b4f9c"/>
<text x="870" y="329.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Ordenar grupos</text>
<text x="870" y="346.5" fill="#4a5568" font-size="11" text-anchor="middle">del más grande al más chico</text>
<rect x="390" y="290" width="300" height="86" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="398" y="298" width="6" height="70" rx="3" fill="#0b4f9c"/>
<text x="540" y="329.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Cada sector completo</text>
<text x="540" y="346.5" fill="#4a5568" font-size="11" text-anchor="middle">a la cuadrilla con menor carga</text>
<rect x="60" y="290" width="300" height="86" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="68" y="298" width="6" height="70" rx="3" fill="#5b21b6"/>
<text x="210" y="329.5" fill="#5b21b6" font-size="13.5" font-weight="700" text-anchor="middle">¿Hay casos</text>
<text x="210" y="346.5" fill="#4a5568" font-size="11" text-anchor="middle">CONSTRUCCION?</text>
<rect x="60" y="470" width="300" height="86" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="68" y="478" width="6" height="70" rx="3" fill="#0e7490"/>
<text x="210" y="509.5" fill="#0e7490" font-size="13.5" font-weight="700" text-anchor="middle">Juntar todas las</text>
<text x="210" y="526.5" fill="#4a5568" font-size="11" text-anchor="middle">construcciones en una cuadrilla</text>
<rect x="390" y="470" width="300" height="86" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="398" y="478" width="6" height="70" rx="3" fill="#0b4f9c"/>
<text x="540" y="509.5" fill="#0b4f9c" font-size="13.5" font-weight="700" text-anchor="middle">Renumerar orden</text>
<text x="540" y="526.5" fill="#4a5568" font-size="11" text-anchor="middle">de visita 1..N</text>
<rect x="720" y="470" width="300" height="86" rx="10" fill="#e6f5ec" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="728" y="478" width="6" height="70" rx="3" fill="#1f7a4d"/>
<text x="870" y="501" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">Propuesta final</text>
<text x="870" y="518" fill="#4a5568" font-size="11" text-anchor="middle">grupos por cuadrilla,</text>
<text x="870" y="535" fill="#4a5568" font-size="11" text-anchor="middle">sin asignar y reglas</text>
<rect x="1050" y="470" width="300" height="86" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="1058" y="478" width="6" height="70" rx="3" fill="#4a5568"/>
<text x="1200" y="501" fill="#4a5568" font-size="13.5" font-weight="700" text-anchor="middle">Sin efectos</text>
<text x="1200" y="518" fill="#4a5568" font-size="11" text-anchor="middle">Es una simulación: no crea</text>
<text x="1200" y="535" fill="#4a5568" font-size="11" text-anchor="middle">ni modifica despachos</text>
<path d="M360 153 L390 153" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M690 153 L720 153" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M1020 153 L1050 153" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
