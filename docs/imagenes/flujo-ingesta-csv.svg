<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1000" viewBox="0 0 1320 1000" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1320" height="1000" fill="#ffffff"/>
<rect x="0" y="0" width="1320" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1320" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Flujo de ingesta del CSV diario</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Del archivo de averías a los casos listos para despacho</text>
<text x="1292" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1292" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="970" width="1320" height="30" fill="#f4f6f9"/>
<text x="660" y="989" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="460" y="100" width="400" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="460" y="108" width="6" height="64" rx="3" fill="#1f7a4d"/><text x="660" y="136" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Archivo CSV diario de averías</text><text x="660" y="155" fill="#4a5568" font-size="12" text-anchor="middle">ISO-8859-1 · separador «;» · 80 columnas</text>
<path d="M660 180 L660 200" fill="none" stroke="#0b4f9c" stroke-width="2.5"/>
<path d="M370 200 L950 200" fill="none" stroke="#0b4f9c" stroke-width="2.5"/>
<path d="M370 200 L370 220" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M950 200 L950 220" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="180" y="220" width="380" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="180" y="228" width="6" height="74" rx="3" fill="#0b4f9c"/><text x="370" y="252.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Simulación (sin guardar)</text><text x="370" y="271.5" fill="#4a5568" font-size="12" text-anchor="middle">Valida el archivo y muestra el resumen</text><text x="370" y="288.5" fill="#4a5568" font-size="12" text-anchor="middle">de lo que se cargaría</text>
<rect x="760" y="220" width="380" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="760" y="228" width="6" height="74" rx="3" fill="#0b4f9c"/><text x="950" y="252.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Carga real</text><text x="950" y="271.5" fill="#4a5568" font-size="12" text-anchor="middle">Persiste el lote de ingesta y crea</text><text x="950" y="288.5" fill="#4a5568" font-size="12" text-anchor="middle">los casos en el sistema</text>
<path d="M370 310 L370 350" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<path d="M950 310 L950 350" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="360" y="350" width="600" height="90" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="360" y="358" width="6" height="74" rx="3" fill="#5b21b6"/><text x="660" y="382.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Lectura y depuración del archivo</text><text x="660" y="401.5" fill="#4a5568" font-size="12" text-anchor="middle">Convierte a Unicode, valida el encabezado de 80 columnas</text><text x="660" y="418.5" fill="#4a5568" font-size="12" text-anchor="middle">y normaliza tipos (fecha, número, texto)</text>
<path d="M660 440 L660 480" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="360" y="480" width="600" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="360" y="488" width="6" height="64" rx="3" fill="#5b21b6"/><text x="660" y="516" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Filtro por la central configurada</text><text x="660" y="535" fill="#4a5568" font-size="12" text-anchor="middle">Solo se cargan los casos que pertenecen a la central</text>
<path d="M660 560 L660 600" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="360" y="600" width="600" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="360" y="608" width="6" height="64" rx="3" fill="#5b21b6"/><text x="660" y="636" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Sectorización por dirección</text><text x="660" y="655" fill="#4a5568" font-size="12" text-anchor="middle">Reglas CONTIENE · EXACTO · REGEX → asigna id_sector</text>
<path d="M660 680 L660 720" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="360" y="720" width="600" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="360" y="728" width="6" height="64" rx="3" fill="#8a6100"/><text x="660" y="756" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Control de duplicados</text><text x="660" y="775" fill="#4a5568" font-size="12" text-anchor="middle">id_averia es único global: un caso no se repite</text>
<path d="M660 800 L660 840" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="360" y="840" width="600" height="80" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="360" y="848" width="6" height="64" rx="3" fill="#0b4f9c"/><text x="660" y="876" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Lote de ingesta</text><text x="660" y="895" fill="#4a5568" font-size="12" text-anchor="middle">PROCESANDO → OK / ERROR, con avisos y detalle del lote</text>
<path d="M360 880 L320 880" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="60" y="830" width="260" height="100" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.5" filter="url(#sombra)"/><rect x="60" y="838" width="6" height="84" rx="3" fill="#1f7a4d"/><text x="190" y="867.5" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Casos creados en NUEVO</text><text x="190" y="886.5" fill="#4a5568" font-size="12" text-anchor="middle">Listos para el PANEL,</text><text x="190" y="903.5" fill="#4a5568" font-size="12" text-anchor="middle">CASOS y el DESPACHO</text>
<path d="M960 880 L1020 880" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<rect x="1020" y="830" width="270" height="110" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><rect x="1020" y="838" width="6" height="94" rx="3" fill="#8a6100"/><text x="1155" y="865" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">Detección de fallas masivas</text><text x="1155" y="883" fill="#4a5568" font-size="11" text-anchor="middle">Umbral 5 casos en 24 h por OLT,</text><text x="1155" y="899" fill="#4a5568" font-size="11" text-anchor="middle">FAT o sector. No se duplica</text><text x="1155" y="915" fill="#4a5568" font-size="11" text-anchor="middle">mientras la falla siga activa.</text>
<rect x="1020" y="104" width="270" height="106" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><rect x="1020" y="112" width="6" height="90" rx="3" fill="#d7dde6"/><text x="1155" y="129" fill="#4a5568" font-size="13" font-weight="700" text-anchor="middle">Quién puede cargar</text><text x="1155" y="147" fill="#4a5568" font-size="11" text-anchor="middle">Escritura: ADMIN y SUPERVISOR</text><text x="1155" y="163" fill="#4a5568" font-size="11" text-anchor="middle">(SUPER tiene acceso total).</text><text x="1155" y="179" fill="#4a5568" font-size="11" text-anchor="middle">La consulta del historial</text><text x="1155" y="195" fill="#4a5568" font-size="11" text-anchor="middle">de lotes sí está disponible.</text>

</svg>