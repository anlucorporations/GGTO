568" font-size="12" text-anchor="start">Bandeja de notificaciones</text>
<path d="M560 442 L560 900" fill="none" stroke="#0b4f9c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaAzul)"/>
