<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700">Mapa de pantallas de la SPA</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13">Una pantalla pública, el armazón y las seis secciones de la barra</text>
<text x="1332" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1332" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="1110" width="1360" height="30" fill="#f4f6f9"/>
<text x="680" y="1129" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>

<rect x="530" y="100" width="300" height="76" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="530" y="108" width="6" height="60" rx="3" fill="#1f7a4d"/><text x="680" y="130" fill="#08396f" font-size="14" font-weight="700" text-anchor="middle">Pantalla de acceso /login</text><text x="680" y="150" fill="#4a5568" font-size="12" text-anchor="middle">Única pantalla pública</text>
<path d="M680 176 L680 204" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<polygon points="680,206 850,270 680,334 510,270" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" filter="url(#sombra)"/><text x="680" y="275" fill="#8a6100" font-size="13" font-weight="700" text-anchor="middle">¿Sesión válida?</text>
<path d="M510 270 L430 270 L430 138 L528 138" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="470" y="256" fill="#0b4f9c" font-size="11.5" font-weight="600" text-anchor="middle">No</text>
<path d="M680 334 L680 364" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/><text x="694" y="356" fill="#0b4f9c" font-size="11.5" font-weight="600" text-anchor="start">Sí</text>
<rect x="430" y="366" width="500" height="84" rx="10" fill="#e8f0fa" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="430" y="374" width="6" height="68" rx="3" fill="#0b4f9c"/><text x="680" y="400" fill="#08396f" font-size="15" font-weight="700" text-anchor="middle">Armazón (Layout)</text><text x="680" y="422" fill="#4a5568" font-size="12" text-anchor="middle">Barra superior + contenido de la sección</text>

