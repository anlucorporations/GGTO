<path d="M1300 875 L1252 875" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>

<rect x="110" y="530" width="470" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="110" y="538" width="6" height="94" rx="3" fill="#0b4f9c"/><text x="132" y="570" fill="#08396f" font-size="15.5" font-weight="700" text-anchor="start">OPERACIÓN  /</text><text x="132" y="592" fill="#4a5568" font-size="12" text-anchor="start">Las cuatro pantallas apiladas en una sola página:</text><rect x="132" y="602" width="100" height="26" rx="6" fill="#e8f0fa" stroke="#0b4f9c" stroke-width="1"/><text x="182" y="620" fill="#08396f" font-size="11" font-weight="700" text-anchor="middle">Panel</text><rect x="240" y="602" width="100" height="26" rx="6" fill="#e8f0fa" stroke="#0b4f9c" stroke-width="1"/><text x="290" y="620" fill="#08396f" font-size="11" font-weight="700" text-anchor="middle">Ingesta</text><rect x="348" y="602" width="100" height="26" rx="6" fill="#e8f0fa" stroke="#0b4f9c" stroke-width="1"/><text x="398" y="620" fill="#08396f" font-size="11" font-weight="700" text-anchor="middle">Monitoreo</text><rect x="456" y="602" width="100" height="26" rx="6" fill="#e8f0fa" stroke="#0b4f9c" stroke-width="1"/><text x="506" y="620" fill="#08396f" font-size="11" font-weight="700" text-anchor="middle">Alertas</text>

<rect x="110" y="675" width="470" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="110" y="683" width="6" height="94" rx="3" fill="#1f7a4d"/><text x="132" y="715" fill="#08396f" font-size="15.5" font-weight="700" text-anchor="start">CASOS  /casos</text><text x="132" y="737" fill="#4a5568" font-size="12" text-anchor="start">Ver, buscar, crear y editar casos</text><text x="132" y="759" fill="#4a5568" font-size="11.5" text-anchor="start">Filtros en una sola fila y total de registros</text>

<rect x="110" y="820" width="470" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="110" y="828" width="6" height="94" rx="3" fill="#1f7a4d"/><text x="132" y="860" fill="#08396f" font-size="15.5" font-weight="700" text-anchor="start">ESPECIALES  /especiales</text><text x="132" y="882" fill="#4a5568" font-size="12" text-anchor="start">Casos especiales con seguimiento propio</text><text x="132" y="904" fill="#4a5568" font-size="11.5" text-anchor="start">Motivo, flujo y control aparte del flujo normal</text>

<rect x="780" y="530" width="470" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="780" y="538" width="6" height="94" rx="3" fill="#1f7a4d"/><text x="802" y="570" fill="#08396f" font-size="15.5" font-weight="700" text-anchor="start">AGENDA  /agenda</text><text x="802" y="592" fill="#4a5568" font-size="12" text-anchor="start">Citas de contacto y atención al cliente</text><text x="802" y="614" fill="#4a5568" font-size="11.5" text-anchor="start">Calendario de citas y recordatorios</text>

<rect x="780" y="675" width="470" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="780" y="683" width="6" height="94" rx="3" fill="#1f7a4d"/><text x="802" y="715" fill="#08396f" font-size="15.5" font-weight="700" text-anchor="start">DESPACHO  /despacho</text><text x="802" y="737" fill="#4a5568" font-size="12" text-anchor="start">Reparto del trabajo entre cuadrillas</text><text x="802" y="759" fill="#4a5568" font-size="11.5" text-anchor="start">Asignación y control del despacho</text>

<rect x="780" y="820" width="470" height="110" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/><rect x="780" y="828" width="6" height="94" rx="3" fill="#0e7490"/><text x="802" y="860" fill="#08396f" font-size="15.5" font-weight="700" text-anchor="start">AYUDA  /ayuda</text><text x="802" y="882" fill="#4a5568" font-size="12" text-anchor="start">Manual de uso dentro de la plataforma</text><text x="802" y="904" fill="#4a5568" font-size="11.5" text-anchor="start">Guía paso a paso, glosario y ayuda</text>

<path d="M680 500 L680 698" fill="none" stroke="#0b4f9c" stroke-width="2" stroke-dasharray="7 5"/>
<text x="680" y="716" fill="#0b4f9c" font-size="11.5" font-weight="600" text-anchor="middle">solo SUPER, ADMIN</text>
<text x="680" y="734" fill="#0b4f9c" font-size="11.5" font-weight="600" text-anchor="middle">y SUPERVISOR</text>
<path d="M680 752 L680 964" fill="none" stroke="#0b4f9c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaAzul)"/>
<rect x="430" y="966" width="500" height="118" rx="10" fill="#e8f0fa" stroke="#0b4f9c" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><text x="680" y="1000" fill="#08396f" font-size="15" font-weight="700" text-anchor="middle">CONFIGURACIÓN · 7 pantallas</text><text x="680" y="1024" fill="#4a5568" font-size="12" text-anchor="middle">central · sectores · técnicos · flota</text><text x="680" y="1044" fill="#4a5568" font-size="12" text-anchor="middle">cuadrillas · catálogos · parámetros</text><text x="680" y="1068" fill="#0b4f9c" font-size="11.5" font-weight="700" text-anchor="middle">Rama aparte · solo SUPER, ADMIN y SUPERVISOR</text>

<rect x="60" y="966" width="360" height="118" rx="10" fill="#fff4d6" stroke="#8a6100" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><text x="80" y="996" fill="#8a6100" font-size="13" font-weight="700" text-anchor="start">Direcciones antiguas</text><text x="80" y="1022" fill="#4a5568" font-size="11.5" text-anchor="start">/ingesta · /monitoreo · /alertas</text><text x="80" y="1042" fill="#4a5568" font-size="11.5" text-anchor="start">ya no son pantallas separadas:</text><text x="80" y="1064" fill="#8a6100" font-size="11.5" font-weight="700" text-anchor="start">redirigen a / (OPERACIÓN)</text>

<rect x="940" y="966" width="360" height="118" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><text x="960" y="996" fill="#08396f" font-size="13" font-weight="700" text-anchor="start">Reglas de navegación</text><text x="960" y="1022" fill="#4a5568" font-size="11.5" text-anchor="start">Cualquier dirección desconocida vuelve a /.</text><text x="960" y="1042" fill="#4a5568" font-size="11.5" text-anchor="start">La protección de pantallas es la primera</text><text x="960" y="1062" fill="#4a5568" font-size="11.5" text-anchor="start">barrera; la seguridad real la aplica el motor.</text>

</svg>
