<text x="560" y="650" fill="#0b4f9c" font-size="11" font-weight="600" text-anchor="middle">y SUPERVISOR</text>
<rect x="310" y="900" width="500" height="70" rx="10" fill="#e8f0fa" stroke="#0b4f9c" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/><text x="560" y="930.5" fill="#08396f" font-size="13" font-weight="700" text-anchor="middle">CONFIGURACIÓN (7 pantallas)</text><text x="560" y="948.5" fill="#4a5568" font-size="12" text-anchor="middle">central · sectores · técnicos · flota · cuadrillas · catálogos · parámetros</text>
<text x="60" y="1004" fill="#4a5568" font-size="11.5" font-weight="400" text-anchor="start">Cualquier dirección desconocida vuelve al PANEL. La protección de pantallas es la primera barrera; la seguridad real la aplica el motor.</text>

