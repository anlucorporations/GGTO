<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="gAzul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b4f9c"/><stop offset="1" stop-color="#08396f"/></linearGradient>
<filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#101828" flood-opacity="0.14"/></filter>
<marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f9c"/></marker><marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="flechaRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6100"/></marker><marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="flechaTurquesa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="1400" height="790" fill="#ffffff"/>
<rect x="0" y="0" width="1400" height="78" fill="url(#gAzul)"/>
<rect x="0" y="78" width="1400" height="3" fill="#1f7a4d"/>
<text x="28" y="33" fill="#ffffff" font-size="21" font-weight="700" text-anchor="start">Bloqueo de la cuenta por intentos fallidos</text>
<text x="28" y="57" fill="#cfe0f4" font-size="13" text-anchor="start">Estados ACTIVA y BLOQUEADA, desbloqueo con palabras de seguridad y códigos de respuesta</text>
<text x="1372" y="34" fill="#ffffff" font-size="15" font-weight="700" text-anchor="end">GGTO · CANTV</text>
<text x="1372" y="56" fill="#cfe0f4" font-size="11" text-anchor="end">Central Francisco Salias · Área 4</text>
<rect x="0" y="760" width="1400" height="30" fill="#f4f6f9"/>
<text x="700" y="779" fill="#4a5568" font-size="11" text-anchor="middle">GGTO — Sistema de administración de reportes de avería y construcción de puntos ópticos · CANTV C.A.</text>
<rect x="90" y="160" width="300" height="96" rx="10" fill="#e6f5ec" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="98" y="168" width="6" height="80" rx="3" fill="#1f7a4d"/>
<text x="240" y="204.5" fill="#1f7a4d" font-size="13.5" font-weight="700" text-anchor="middle">ACTIVA</text>
<text x="240" y="221.5" fill="#4a5568" font-size="12" text-anchor="middle">Se permite iniciar sesión</text>
<rect x="90" y="440" width="300" height="96" rx="10" fill="#fdecea" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="98" y="448" width="6" height="80" rx="3" fill="#b3261e"/>
<text x="240" y="484.5" fill="#b3261e" font-size="13.5" font-weight="700" text-anchor="middle">BLOQUEADA</text>
<text x="240" y="501.5" fill="#4a5568" font-size="12" text-anchor="middle">No se permite iniciar sesión</text>
<path d="M50 208 L90 208" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#flechaGris)"/>
<text x="46" y="212" fill="#4a5568" font-size="11" font-weight="700" text-anchor="end">[*]</text>
<path d="M150 160 L150 124 L430 124 L430 160" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="290" y="116" fill="#8a6100" font-size="11" font-weight="700" text-anchor="middle">clave incorrecta: quedan 2 o 1 intentos</text>
<path d="M240 256 L240 440" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="254" y="352" fill="#b3261e" font-size="11" font-weight="700" text-anchor="start">tercer fallo</text>
<path d="M390 470 L474 470 L474 190 L390 190" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="490" y="336" fill="#1f7a4d" font-size="11" font-weight="700" text-anchor="start">3 palabras correctas</text>
<path d="M160 536 L160 574 L320 574 L320 536" fill="none" stroke="#0b4f9c" stroke-width="2" marker-end="url(#flechaAzul)"/>
<text x="240" y="596" fill="#b3261e" font-size="11" font-weight="700" text-anchor="middle">palabras incorrectas</text>
<rect x="620" y="160" width="720" height="36" rx="10" fill="#e8f0fa" stroke="#d7dde6" stroke-width="1.5" filter="url(#sombra)"/>
<rect x="628" y="168" width="6" height="20" rx="3" fill="#0b4f9c"/>
<text x="640" y="184" fill="#08396f" font-size="13" font-weight="700" text-anchor="start">Evento</text>
<text x="1000" y="184" fill="#08396f" font-size="13" font-weight="700" text-anchor="start">Respuesta del sistema</text>
<rect x="620" y="196" width="720" height="44" fill="#f4f6f9"/>
<text x="640" y="223" fill="#1f2933" font-size="12.5" text-anchor="start">Supera 10 intentos en 60 segundos</text>
<text x="1000" y="223" fill="#4a5568" font-size="12.5" text-anchor="start">429 Too Many Requests</text>
<text x="640" y="267" fill="#1f2933" font-size="12.5" text-anchor="start">P00 inexistente</text>
<text x="1000" y="267" fill="#4a5568" font-size="12.5" text-anchor="start">401 genérico</text>
<rect x="620" y="284" width="720" height="44" fill="#f4f6f9"/>
<text x="640" y="311" fill="#1f2933" font-size="12.5" text-anchor="start">Usuario inactivo</text>
<text x="1000" y="311" fill="#4a5568" font-size="12.5" text-anchor="start">403</text>
<text x="640" y="355" fill="#1f2933" font-size="12.5" text-anchor="start">Usuario bloqueado</text>
<text x="1000" y="355" fill="#4a5568" font-size="12.5" text-anchor="start">423 Locked</text>
<rect x="620" y="372" width="720" height="44" fill="#f4f6f9"/>
<text x="640" y="399" fill="#1f2933" font-size="12.5" text-anchor="start">Clave incorrecta</text>
<text x="1000" y="399" fill="#4a5568" font-size="12.5" text-anchor="start">401 con X-Intentos-Restantes</text>
<text x="640" y="443" fill="#1f2933" font-size="12.5" text-anchor="start">Tercer fallo</text>
<text x="1000" y="443" fill="#4a5568" font-size="12.5" text-anchor="start">423 y cuenta bloqueada</text>
<rect x="620" y="160" width="720" height="300" rx="6" fill="none" stroke="#d7dde6" stroke-width="1.5"/>
<path d="M620 240 L620 240" fill="none" stroke="#0b4f9c" stroke-width="0"/>
<rect x="620" y="240" width="720" height="1" fill="#d7dde6"/>
<path d="M620 284 L620 284" fill="none" stroke="#0b4f9c" stroke-width="0"/>
<rect x="620" y="284" width="720" height="1" fill="#d7dde6"/>
<path d="M620 328 L620 328" fill="none" stroke="#0b4f9c" stroke-width="0"/>
<rect x="620" y="328" width="720" height="1" fill="#d7dde6"/>
<path d="M620 372 L620 372" fill="none" stroke="#0b4f9c" stroke-width="0"/>
<rect x="620" y="372" width="720" height="1" fill="#d7dde6"/>
<path d="M620 416 L620 416" fill="none" stroke="#0b4f9c" stroke-width="0"/>
<rect x="620" y="416" width="720" height="1" fill="#d7dde6"/>
<rect x="990" y="160" width="1" height="300" fill="#d7dde6"/>
<rect x="620" y="480" width="720" height="125" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/>
<rect x="628" y="488" width="6" height="109" rx="3" fill="#d7dde6"/>
<text x="642" y="505" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">Recuperación del bloqueo</text>
<text x="642" y="522" fill="#4a5568" font-size="11.5" text-anchor="start">El desbloqueo no depende del paso del tiempo ni de un administrador: se resuelve con las palabras de seguridad del</text>
<text x="642" y="539" fill="#4a5568" font-size="11.5" text-anchor="start">dispositivo.</text>
<text x="642" y="556" fill="#4a5568" font-size="11.5" text-anchor="start">El perfil guarda 12 palabras y se piden 3 en posiciones concretas. El sistema recorre las posiciones enviadas, calcula</text>
<text x="642" y="573" fill="#4a5568" font-size="11.5" text-anchor="start">el índice, valida el rango y compara el cifrado guardado; si algo falla, responde «no coincide».</text>
<text x="642" y="590" fill="#4a5568" font-size="11.5" text-anchor="start">Las pruebas cubren el desbloqueo correcto, el rechazo con palabras incorrectas y el restablecimiento de la clave.</text>
<rect x="60" y="640" width="520" height="92" rx="10" fill="#ffffff" stroke="#d7dde6" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sombra)"/>
<rect x="68" y="648" width="6" height="76" rx="3" fill="#d7dde6"/>
<text x="82" y="665.5" fill="#4a5568" font-size="13" font-weight="700" text-anchor="start">Cómo se comporta el bloqueo</text>
<text x="82" y="682.5" fill="#4a5568" font-size="11.5" text-anchor="start">El bloqueo se dispara con el tercer fallo consecutivo y no se libera solo con el</text>
<text x="82" y="699.5" fill="#4a5568" font-size="11.5" text-anchor="start">tiempo.</text>
<text x="82" y="716.5" fill="#4a5568" font-size="11.5" text-anchor="start">Las palabras de seguridad también restablecen la clave, además de desbloquear.</text>
</svg>
