name: ggto_tecnico
description: App Móvil para Técnicos de Terreno GGTO — Ciclo 8
publish_to: 'none'
# versionCode (lo que va tras el «+») debe crecer en CADA entrega a CANTV.
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  geolocator: ^14.0.0
  archive: ^3.6.1
  provider: ^6.1.2
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  geolocator_android: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Aviso de uso restringido (texto plano). Se regenera con:
    #   python scripts/generar_disclaimer.py
    - assets/disclaimer.txt
    # Logo institucional CANTV (WebP generado desde docs/imagenes/CANTV_logo.svg)
    - assets/logo_CANTV.webp
