name: ggto_tecnico
description: App Móvil para Técnicos de Terreno GGTO — Ciclo 8
publish_to: 'none'
# versionCode (lo que va tras el «+») debe crecer en CADA entrega a CANTV.
version: 1.15.17+42

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  geolocator: ^14.0.0
  archive: ^3.6.1
  provider: ^6.1.2
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  share_plus: ^12.0.2
  # D-102: abrir en el navegador la descarga de la última APK publicada.
  # Paquete oficial de Flutter; sus implementaciones de escritorio/web ya venían
  # en `pubspec.lock` como transitivas.
  url_launcher: ^6.3.0
  # D-100: PBKDF2-HMAC-SHA256 para el verificador del PIN de acceso sin conexión.
  # Ya venía como dependencia transitiva (`crypto 3.0.7` en pubspec.lock).
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # D-112: prueba de campo automatizada sobre la APK real en un emulador
  # (`flutter test integration_test -d emulator-5554`). El doble del selector de
  # imágenes permite inyectar una foto ya existente sin abrir la cámara.
  integration_test:
    sdk: flutter
  image_picker_platform_interface: ^2.10.1

dependency_overrides:
  # El SDK de compilación es Flutter 3.24.5 (Dart 3.5). geolocator_android ≥5.0 usa
  # Color.toARGB32() (Dart ≥3.6); se retrotrae el par completo a la serie compatible.
  geolocator: ^13.0.1
  geolocator_android: ^4.6.1

flutter:
  uses-material-design: true
  assets:
    # Aviso de uso restringido (texto plano). Se regenera con:
    #   python scripts/generar_disclaimer.py
    - assets/disclaimer.txt
    # Logo institucional CANTV (WebP generado desde docs/imagenes/CANTV_logo.svg)
    - assets/logo_CANTV.webp
    # Activos de marca v2 (propuesta visual aplicada). Se regeneran con:
    #   python docs/propuesta-visual-apk/scripts/preparar_apk.py
    - assets/marca/
